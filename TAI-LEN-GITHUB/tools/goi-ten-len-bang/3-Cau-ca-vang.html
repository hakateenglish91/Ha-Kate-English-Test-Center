*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#090b1c;color:#fff;
  font-family:'BVP','Segoe UI',Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit}
#san,#phao{position:fixed;inset:0;width:100%;height:100%;display:block}
#phao{pointer-events:none;z-index:40}
.an{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ───────── thanh trên ───────── */
#tren{position:fixed;left:0;right:0;top:0;height:76px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 18px;
  background:linear-gradient(180deg,rgba(4,5,18,.72),rgba(4,5,18,.25) 70%,rgba(4,5,18,0))}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo .bt{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none;
  background:linear-gradient(140deg,var(--chinh),var(--phu));box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.logo b{display:block;font-weight:900;font-size:23px;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap}
.logo small{display:block;font-weight:600;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--chinh);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.nut{appearance:none;border:1px solid var(--vien);background:rgba(16,18,46,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;font-weight:700;font-size:15px;padding:10px 15px;border-radius:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap;line-height:1.1}
.nut:hover{background:rgba(44,48,100,.85);border-color:var(--vien2);transform:translateY(-1px)}
.nut:active{transform:translateY(1px) scale(.97)}
.nut.vua{padding:8px 12px;font-size:14px;border-radius:12px}
.nut.chinh{background:linear-gradient(180deg,var(--chinh),var(--chinh2));color:#3a1d00;border-color:transparent;box-shadow:0 5px 0 rgba(120,50,0,.55),0 10px 24px rgba(0,0,0,.35)}
.nut.chinh:hover{filter:brightness(1.06)}
.nut.xanh{background:linear-gradient(180deg,#4ADE80,#16A34A);border-color:transparent;color:#05310f;box-shadow:0 5px 0 rgba(4,60,20,.6)}
.nut.do{background:linear-gradient(180deg,#FF6B81,#E11D48);border-color:transparent;box-shadow:0 5px 0 rgba(90,0,20,.6)}
.nut.trong{background:transparent;border-color:transparent}
.nut.trong:hover{background:rgba(255,255,255,.08)}
.nut[disabled]{opacity:.45;pointer-events:none}
.chip-lop{display:inline-flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:16px;border:1px solid var(--vien2);
  background:rgba(16,18,46,.72);backdrop-filter:blur(12px);cursor:pointer;font-weight:800;font-size:16px}
.chip-lop .so{font-weight:700;font-size:13px;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.12);color:var(--mo)}
.chip-lop select{appearance:none;background:transparent;border:0;color:#fff;font-weight:800;font-size:17px;cursor:pointer;outline:0;max-width:200px}
.chip-lop select option{background:#1b1e44;color:#fff}

/* ───────── dải dưới ───────── */
#duoi{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0 22px 26px;pointer-events:none}
#duoi>*{pointer-events:auto}
#nutGoi{position:relative;appearance:none;border:0;cursor:pointer;min-width:330px;height:86px;padding:0 44px;border-radius:999px;
  font-weight:900;font-size:32px;letter-spacing:1px;color:#3b1700;display:flex;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,#FFE27A 0%,var(--chinh) 38%,var(--chinh2) 100%);
  box-shadow:0 9px 0 #9a3d00,0 18px 40px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.65),0 0 0 6px rgba(255,201,60,.22);
  transition:transform .12s,box-shadow .12s,filter .2s;animation:moiGoi 2.2s ease-in-out infinite}
#nutGoi:hover{filter:brightness(1.07)}
#nutGoi:active{transform:translateY(6px);box-shadow:0 3px 0 #9a3d00,0 10px 24px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.6)}
#nutGoi .phim{font-size:12px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:8px;background:rgba(80,30,0,.18);color:#5a2600}
#nutGoi[disabled]{animation:none;filter:saturate(.6) brightness(.9);pointer-events:none}
#nutGoi[disabled] .phim{display:none}
@keyframes moiGoi{0%,100%{box-shadow:0 9px 0 #9a3d00,0 18px 40px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.65),0 0 0 6px rgba(255,201,60,.22)}
  50%{box-shadow:0 9px 0 #9a3d00,0 18px 40px rgba(0,0,0,.5),inset 0 3px 0 rgba(255,255,255,.65),0 0 0 16px rgba(255,201,60,0)}}
.goc{position:absolute;bottom:30px;display:flex;gap:10px;align-items:center}
.goc.trai{left:22px}.goc.phai{right:22px}
.tien-do{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:18px;background:rgba(16,18,46,.72);border:1px solid var(--vien);
  backdrop-filter:blur(12px);cursor:pointer;font-weight:700}
.tien-do svg.vong{width:46px;height:46px}
.tien-do b{font-size:18px;font-weight:900}
.tien-do small{display:block;font-size:12px;color:var(--mo);font-weight:600}

/* ───────── lớp phủ chung ───────── */
.phu{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(6,7,24,.55),rgba(3,4,14,.86));
  opacity:0;pointer-events:none;transition:opacity .25s}
.phu.mo{opacity:1;pointer-events:auto}
.hop{background:var(--kinh2);border:1px solid var(--vien2);border-radius:26px;box-shadow:var(--bong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.phu .hop{transform:translateY(18px) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.phu.mo .hop{transform:none}
.dau-hop{display:flex;align-items:center;gap:12px;padding:20px 24px 14px}
.dau-hop h2{font-weight:900;font-size:24px;margin-right:auto;display:flex;align-items:center;gap:10px}
.dau-hop h2 svg.i{width:26px;height:26px;color:var(--chinh)}
.dong-x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--vien);background:rgba(255,255,255,.05);color:#fff;cursor:pointer}
.dong-x:hover{background:rgba(255,255,255,.14)}

/* ───────── thẻ công bố tên ───────── */
#phuTen{background:radial-gradient(ellipse at center,rgba(10,8,40,.35),rgba(3,4,14,.8))}
#theTen{position:relative;width:min(1040px,92vw);padding:34px 40px 30px;text-align:center;border-radius:34px;
  background:linear-gradient(160deg,rgba(40,30,110,.92),rgba(18,16,52,.95));border:2px solid rgba(255,255,255,.18);
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05),0 0 120px rgba(124,92,255,.35)}
#theTen::before{content:"";position:absolute;inset:-3px;border-radius:36px;padding:3px;z-index:-1;
  background:conic-gradient(from var(--goc,0deg),var(--chinh),#FF4D6D,var(--phu),var(--sang),var(--chinh));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:quayVien 4s linear infinite}
@property --goc{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes quayVien{to{--goc:360deg}}
.phu.mo #theTen{animation:theVao .7s cubic-bezier(.2,1.5,.35,1) both}
@keyframes theVao{0%{transform:scale(.4) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.moi-em{display:inline-flex;align-items:center;gap:10px;padding:8px 22px;border-radius:999px;font-weight:900;font-size:22px;letter-spacing:3px;
  color:#3b1700;background:linear-gradient(180deg,#FFE27A,var(--chinh2));box-shadow:0 5px 0 #9a3d00}
.ten-lon{font-weight:900;line-height:1.12;margin:22px 0 6px;letter-spacing:-.5px;white-space:nowrap;color:#FFF6D8;
  text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 34px rgba(255,201,60,.45)}
.ten-lon .chu{display:inline-block;animation:chuRoi .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes chuRoi{0%{transform:translateY(-70px) scale(1.4);opacity:0}100%{transform:none;opacity:1}}
.len-bang{font-weight:800;font-size:28px;color:var(--mo);letter-spacing:1px}
.nhieu-ten{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:24px 0 8px}
.the-nho{position:relative;padding:14px 26px;border-radius:20px;font-weight:900;font-size:40px;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.16);animation:theVao .6s cubic-bezier(.2,1.5,.35,1) both}
.the-nho i{font-style:normal;font-size:16px;font-weight:800;color:var(--chinh);display:block;letter-spacing:1px;margin-bottom:2px}
.the-nho .xoa-vang{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:0;background:#E11D48;color:#fff;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.the-nho .xoa-vang svg.i{width:16px;height:16px}
.hang-nut{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.hang-nut .nut{font-size:17px;padding:13px 20px;border-radius:16px}
.xao{animation:xao .09s linear infinite}
@keyframes xao{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}}

/* ───────── đồng hồ ───────── */
#phuGio .hop{width:min(980px,94vw);padding:0 0 26px;text-align:center}
.mat-so{position:relative;width:min(400px,46vh);height:min(400px,46vh);margin:4px auto 0}
.mat-so svg{width:100%;height:100%;overflow:visible}
.mat-so .giua{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.so-gio{font-weight:900;font-size:min(104px,12vh);line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.don-vi{font-weight:700;font-size:18px;color:var(--mo);margin-top:6px}
.chip-gio{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 26px 0}
.chip-gio button{appearance:none;border:1px solid var(--vien2);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:17px;
  padding:11px 17px;border-radius:14px;cursor:pointer;transition:transform .12s,background .15s}
.chip-gio button:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.chip-gio button.chon{background:linear-gradient(180deg,#FFE27A,var(--chinh2));color:#3b1700;border-color:transparent;box-shadow:0 4px 0 #9a3d00}
.chinh-gio{display:flex;gap:10px;justify-content:center;margin-top:12px}
.ai-tra-loi{font-weight:800;font-size:22px;color:var(--chinh);min-height:30px;margin-top:2px}
.ai-tra-loi:empty{display:none}
#phuGio.dang-chay .chi-chon,#phuGio:not(.dang-chay) .chi-chay{display:none!important}
#phuGio.gap .so-gio{color:#FF6B81;animation:dap .5s ease-out infinite}
@keyframes dap{0%{transform:scale(1.18)}100%{transform:scale(1)}}
#phuGio.het .hop{animation:rung .5s linear 2}
#phuGio.het .giua{opacity:0}
.nhan-o{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--chinh);margin-bottom:6px}
.o-cot{display:flex;flex-direction:column;min-height:0}
.o-cot textarea{height:auto;flex:1;min-height:0}
@keyframes rung{0%,100%{transform:none}20%{transform:translateX(-14px) rotate(-1deg)}40%{transform:translateX(12px) rotate(1deg)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.dau-het{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font-weight:900;font-size:min(120px,13vh);white-space:nowrap;
  color:#FF4D6D;border:10px solid #FF4D6D;border-radius:26px;padding:6px 34px;background:rgba(20,0,10,.55);text-shadow:0 4px 0 rgba(0,0,0,.35);
  box-shadow:0 0 60px rgba(255,77,109,.5);animation:dongDau .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
@keyframes dongDau{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
/* đồng hồ thu nhỏ ở góc */
#gioNho{position:fixed;right:22px;top:92px;z-index:45;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:22px;cursor:pointer;
  background:rgba(14,16,40,.86);border:1px solid var(--vien2);backdrop-filter:blur(12px);box-shadow:var(--bong)}
#gioNho svg{width:64px;height:64px}
#gioNho b{font-weight:900;font-size:38px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#gioNho small{display:block;font-size:12px;color:var(--mo);font-weight:700;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gioNho.gap b{color:#FF6B81}

/* ───────── bảng danh sách ───────── */
#phuDs .hop{width:min(1180px,95vw);height:min(760px,92vh);display:flex;flex-direction:column}
.than-ds{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr;gap:18px;padding:0 24px 0}
.cot-lop{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding-right:4px}
.cot-lop .muc{display:flex;align-items:center;gap:8px;padding:12px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;font-weight:800;font-size:17px}
.cot-lop .muc span{margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cot-lop .muc small{font-weight:700;color:var(--mo);font-size:13px}
.cot-lop .muc:hover{background:rgba(255,255,255,.06)}
.cot-lop .muc.chon{background:rgba(255,201,60,.14);border-color:rgba(255,201,60,.45)}
.cot-nhap{display:flex;flex-direction:column;gap:10px;min-height:0}
.hang{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.o-ten-lop{flex:1;min-width:180px;background:rgba(0,0,0,.25);border:1px solid var(--vien2);border-radius:12px;color:#fff;font-weight:800;font-size:18px;padding:10px 14px;outline:0}
.o-ten-lop:focus,textarea:focus{border-color:var(--chinh)}
.o-ten-lop::placeholder,textarea::placeholder{color:var(--mo2);font-weight:600}
.hai-o{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea{width:100%;height:100%;resize:none;background:rgba(0,0,0,.28);border:1px solid var(--vien2);border-radius:14px;color:#fff;
  font-size:16px;font-weight:600;line-height:1.55;padding:12px 14px;outline:0;user-select:text;-webkit-user-select:text}
.xem-truoc{min-height:0;overflow:auto;border-radius:14px;border:1px dashed var(--vien2);padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.xem-truoc .hs{padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:700;font-size:14.5px;cursor:pointer;border:1px solid transparent}
.xem-truoc .hs b{color:var(--chinh);font-weight:800;margin-right:5px;font-size:12px}
.xem-truoc .hs:hover{border-color:var(--vien2)}
.xem-truoc .hs.vang{opacity:.45;text-decoration:line-through}
.xem-truoc .trong-rong{color:var(--mo2);font-weight:600;padding:20px;text-align:center;width:100%;line-height:1.6}
.nhan{font-size:13.5px;color:var(--mo);font-weight:700}
.nhan b{color:#fff}
.chan-hop{display:flex;align-items:center;gap:12px;padding:16px 24px 20px}
.chan-hop .nhan{margin-right:auto}

/* ───────── ngăn kéo bên phải (cài đặt, lịch sử, trò khác) ───────── */
.ngan{position:fixed;top:0;right:0;bottom:0;width:min(470px,92vw);z-index:55;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;border-radius:26px 0 0 26px;border-right:0}
.ngan.mo{transform:none}
.man-ngan{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.man-ngan.mo{opacity:1;pointer-events:auto}
.ruot-ngan{flex:1;overflow:auto;padding:4px 24px 24px}
.nhom{margin:16px 0 0}
.nhom h3{font-size:14px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--chinh);margin-bottom:9px}
.nhom p{font-size:13.5px;color:var(--mo);font-weight:600;margin-top:7px;line-height:1.5}
.doan{display:flex;flex-wrap:wrap;gap:7px}
.doan button{appearance:none;border:1px solid var(--vien2);background:rgba(255,255,255,.05);color:#fff;font-weight:800;font-size:15px;padding:9px 13px;border-radius:12px;cursor:pointer}
.doan button:hover{background:rgba(255,255,255,.12)}
.doan button.chon{background:linear-gradient(180deg,#FFE27A,var(--chinh2));color:#3b1700;border-color:transparent}
.cong-tac{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15.5px;cursor:pointer;padding:6px 0}
.cong-tac input{display:none}
.cong-tac i{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.cong-tac i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.cong-tac input:checked+i{background:var(--xanh)}
.cong-tac input:checked+i::after{transform:translateX(22px)}
input[type=range]{width:100%;accent-color:var(--chinh)}
.ls{display:flex;flex-direction:column;gap:6px}
.ls .dong{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-weight:700}
.ls .dong span{margin-right:auto}
.ls .dong small{color:var(--mo);font-weight:600}
.ls .stt{width:30px;height:30px;border-radius:9px;background:rgba(255,201,60,.18);color:var(--chinh);display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.thanh{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.thanh i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--xanh),var(--chinh))}
.tro{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--vien);margin-bottom:10px;
  cursor:pointer;text-decoration:none;color:#fff;transition:transform .15s,background .15s}
.tro:hover{background:rgba(255,255,255,.11);transform:translateX(-4px)}
.tro .bt{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
.tro b{font-weight:900;font-size:18px;display:block}
.tro small{color:var(--mo);font-weight:600;font-size:13.5px}
.tro.dang{border-color:rgba(255,201,60,.5);background:rgba(255,201,60,.1)}

/* ───────── thông báo, gợi ý ───────── */
#bao{position:fixed;left:50%;top:92px;z-index:70;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bao div{padding:12px 20px;border-radius:16px;background:rgba(14,16,40,.92);border:1px solid var(--vien2);font-weight:800;font-size:17px;box-shadow:var(--bong);
  animation:baoVao .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes baoVao{0%{transform:translateY(-16px);opacity:0}100%{transform:none;opacity:1}}
#goiY{position:fixed;z-index:25;max-width:330px;padding:14px 16px;border-radius:16px;background:#FFF3C4;color:#3b2a00;font-weight:700;font-size:15px;line-height:1.45;
  box-shadow:0 14px 34px rgba(0,0,0,.45);animation:nhun 1.6s ease-in-out infinite}
#goiY::before{content:"";position:absolute;top:-9px;left:var(--mui,40px);border:10px solid transparent;border-top:0;border-bottom-color:#FFF3C4}
#goiY b{font-weight:900}
#goiY button{margin-top:8px;border:0;background:#3b2a00;color:#FFF3C4;font-weight:800;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px}

<noscript><p style="padding:40px;font:20px sans-serif;color:#fff">Hãy mở tệp bằng Chrome, Edge hoặc Cốc Cốc.</p></noscript>
<script>/* Âm thanh tự tổng hợp bằng Web Audio — không cần tệp âm thanh nào, chạy được khi không có mạng.
   AmThanh.phat(ten, tuyChon) -> {dung()}      (âm kéo dài như tiếng động cơ thì gọi dung() để tắt)
   Khi quay video: đặt window.__GHI_AM = [] trước khi chạy -> chỉ ghi sự kiện, không phát;
   sau đó AmThanh.dungOffline(suKien, giay) dựng lại đúng các âm đó thành AudioBuffer. */
(() => {
  'use strict';
  let ctx = null, chinh = null, bat = true, amLuong = 0.8, dem = 0;
  const NHIEU = new WeakMap();

  function nhieu(c) {               // 2 giây nhiễu trắng, dùng chung
    let b = NHIEU.get(c);
    if (!b) {
      b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = b.getChannelData(0);
      let s = 12345;
      for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
      NHIEU.set(c, b);
    }
    return b;
  }
  function g(c, out, v = 1) { const n = c.createGain(); n.gain.value = v; n.connect(out); return n; }
  function bao(n, t, a, giu, tha, dinh = 1) {   // đường bao: lên trong a giây, giữ, tắt dần trong tha giây
    n.gain.cancelScheduledValues(t);
    n.gain.setValueAtTime(0.0001, t);
    n.gain.exponentialRampToValueAtTime(dinh, t + Math.max(a, 0.002));
    n.gain.setValueAtTime(dinh, t + a + giu);
    n.gain.exponentialRampToValueAtTime(0.0001, t + a + giu + tha);
  }
  function dao(c, loai, f, t, dai, out) {
    const o = c.createOscillator(); o.type = loai; o.frequency.setValueAtTime(f, t);
    o.connect(out); o.start(t); o.stop(t + dai + 0.05); return o;
  }
  function suot(c, t, dai, out, loc = 'bandpass', f = 1000, q = 1) {   // nhiễu qua bộ lọc
    const s = c.createBufferSource(); s.buffer = nhieu(c); s.loop = true;
    const b = c.createBiquadFilter(); b.type = loc; b.frequency.setValueAtTime(f, t); b.Q.value = q;
    s.connect(b); b.connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dai + 0.05);
    return { s, b };
  }
  function trong(c, out, t, v = 1) {             // tiếng trống bass
    const n = g(c, out, 0); bao(n, t, 0.003, 0.02, 0.32, 0.9 * v);
    const o = dao(c, 'sine', 150, t, 0.4, n); o.frequency.exponentialRampToValueAtTime(42, t + 0.3);
  }
  function snare(c, out, t, v = 1) {
    const n = g(c, out, 0); bao(n, t, 0.002, 0.01, 0.12, 0.5 * v);
    suot(c, t, 0.16, n, 'highpass', 1400, 0.7);
    const n2 = g(c, out, 0); bao(n2, t, 0.002, 0.005, 0.07, 0.35 * v); dao(c, 'triangle', 210, t, 0.1, n2);
  }
  function chuong(c, out, t, f, v = 1, dai = 1.1) {   // tiếng chuông kim loại trong
    [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([k, a]) => {
      const n = g(c, out, 0); bao(n, t, 0.002, 0, dai / k ** 0.5, 0.35 * a * v); dao(c, 'sine', f * k, t, dai, n);
    });
  }

  const SYN = {
    bam(c, out, t) {                                  // bấm nút giao diện
      const n = g(c, out, 0); bao(n, t, 0.002, 0, 0.06, 0.25);
      const o = dao(c, 'sine', 980, t, 0.08, n); o.frequency.exponentialRampToValueAtTime(560, t + 0.06);
    },
    tich(c, out, t, o) {                              // tiếng tích (kim vòng quay, máy quét)
      const k = o.cao || 1, v = o.to ?? 1;
      const n = g(c, out, 0); bao(n, t, 0.001, 0, 0.035, 0.32 * v);
      suot(c, t, 0.05, n, 'bandpass', 3200 * k, 3);
      const n2 = g(c, out, 0); bao(n2, t, 0.001, 0, 0.03, 0.18 * v); dao(c, 'square', 1700 * k, t, 0.04, n2);
    },
    beep(c, out, t, o) {
      const n = g(c, out, 0); bao(n, t, 0.004, (o.dai || 0.06) - 0.01, 0.04, 0.16 * (o.to ?? 1));
      dao(c, o.loai || 'square', 1180 * (o.cao || 1), t, (o.dai || 0.06) + 0.05, n);
    },
    pop(c, out, t, o) {
      const n = g(c, out, 0); bao(n, t, 0.002, 0, 0.09, 0.4 * (o.to ?? 1));
      const x = dao(c, 'sine', 380 * (o.cao || 1), t, 0.12, n); x.frequency.exponentialRampToValueAtTime(980 * (o.cao || 1), t + 0.07);
    },
    ting(c, out, t, o) { chuong(c, out, t, 1568 * (o.cao || 1), o.to ?? 1, o.dai || 1.1); },
    whoosh(c, out, t, o) {
      const dai = o.dai || 0.6, n = g(c, out, 0);
      n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.55 * (o.to ?? 1), t + dai * 0.45);
      n.gain.exponentialRampToValueAtTime(0.0001, t + dai);
      const { b } = suot(c, t, dai, n, 'bandpass', 300, 1.4);
      b.frequency.exponentialRampToValueAtTime(2800 * (o.cao || 1), t + dai * 0.5); b.frequency.exponentialRampToValueAtTime(500, t + dai);
    },
    trongCuon(c, out, t, o) {                          // trống dồn hồi hộp, nhanh dần, to dần
      const dai = o.dai || 3; let x = 0; const ds = [];
      while (x < dai) {
        const p = x / dai, nhip = 9 + 17 * p * p;
        const v = 0.35 + 0.65 * p;
        const n = g(c, out, 0); bao(n, t + x, 0.002, 0.006, 0.06, 0.32 * v);
        ds.push(suot(c, t + x, 0.08, n, 'highpass', 1700, 0.6).s);
        x += 1 / nhip;
      }
      const lan = g(c, out, 0);                       // lớp rền bên dưới
      lan.gain.setValueAtTime(0.0001, t); lan.gain.exponentialRampToValueAtTime(0.16, t + dai);
      const r = suot(c, t, dai, lan, 'bandpass', 900, 0.8);
      return { dung(tt) { lan.gain.cancelScheduledValues(tt); lan.gain.setValueAtTime(0.0001, tt); ds.forEach(s => { try { s.stop(tt); } catch (e) {} }); try { r.s.stop(tt); } catch (e) {} } };
    },
    fanfare(c, out, t, o) {                           // kèn chiến thắng + trống + chũm choẹ
      const v = o.to ?? 1;
      trong(c, out, t, v);
      const cr = g(c, out, 0); bao(cr, t, 0.003, 0.05, 1.6, 0.3 * v); suot(c, t, 1.8, cr, 'highpass', 5200, 0.5);
      const not = [523.25, 659.25, 783.99, 1046.5];
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(out);
      not.forEach((f, i) => {
        const ti = t + 0.02 + i * 0.075, dai = i === 3 ? 1.0 : 0.95 - i * 0.12;
        const n = g(c, lp, 0); bao(n, ti, 0.012, dai * 0.5, dai * 0.6, 0.13 * v);
        dao(c, 'sawtooth', f, ti, dai * 1.2, n); dao(c, 'sawtooth', f * 1.004, ti, dai * 1.2, n);
      });
      const n = g(c, lp, 0); bao(n, t + 0.34, 0.02, 0.5, 0.9, 0.1 * v);
      [523.25, 659.25, 783.99].forEach(f => dao(c, 'square', f / 2, t + 0.34, 1.5, n));
      chuong(c, out, t + 0.3, 2093, 0.55 * v, 1.4);
    },
    tada(c, out, t, o) {                               // ngắn gọn hơn fanfare
      const v = o.to ?? 1; trong(c, out, t, 0.8 * v);
      [784, 1047, 1319].forEach((f, i) => { const n = g(c, out, 0); bao(n, t + i * 0.06, 0.005, 0.15, 0.5, 0.12 * v); dao(c, 'triangle', f, t + i * 0.06, 0.8, n); });
    },
    // ── phi thuyền
    ufoVo(c, out, t, o) {                             // tiếng ù của đĩa bay (kéo dài)
      const n = g(c, out, 0); n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.13 * (o.to ?? 1), t + 0.5);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.connect(n);
      const a = c.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 96;
      const b = c.createOscillator(); b.type = 'sawtooth'; b.frequency.value = 99.5;
      const lfo = c.createOscillator(); lfo.frequency.value = 5.5; const lg = c.createGain(); lg.gain.value = 260;
      lfo.connect(lg); lg.connect(lp.frequency);
      const w = c.createOscillator(); w.type = 'sine'; w.frequency.value = 880; const wg = c.createGain(); wg.gain.value = 0.05;
      const wl = c.createOscillator(); wl.frequency.value = 0.7; const wlg = c.createGain(); wlg.gain.value = 140; wl.connect(wlg); wlg.connect(w.frequency);
      w.connect(wg); wg.connect(n);
      a.connect(lp); b.connect(lp); [a, b, lfo, w, wl].forEach(x => x.start(t));
      return { dung(tt) { n.gain.cancelScheduledValues(tt); n.gain.setValueAtTime(n.gain.value || 0.1, tt); n.gain.exponentialRampToValueAtTime(0.0001, tt + 0.6); [a, b, lfo, w, wl].forEach(x => x.stop(tt + 0.7)); } };
    },
    quet(c, out, t, o) {                               // tiếng quét radar «píu»
      const n = g(c, out, 0); bao(n, t, 0.005, 0.03, 0.12, 0.12 * (o.to ?? 1));
      const x = dao(c, 'sine', 1400 * (o.cao || 1), t, 0.2, n); x.frequency.exponentialRampToValueAtTime(2300 * (o.cao || 1), t + 0.12);
    },
    khoa(c, out, t) {                                  // khoá mục tiêu: «bíp bíp – píng»
      [0, 0.11].forEach(d => { const n = g(c, out, 0); bao(n, t + d, 0.003, 0.05, 0.03, 0.18); dao(c, 'square', 1760, t + d, 0.1, n); });
      chuong(c, out, t + 0.24, 2637, 0.9, 0.9);
    },
    tiaKeo(c, out, t, o) {                             // tia hút: vút lên, lung linh
      const dai = o.dai || 2, n = g(c, out, 0);
      n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.2, t + 0.25); n.gain.setValueAtTime(0.2, t + dai - 0.3); n.gain.exponentialRampToValueAtTime(0.0001, t + dai + 0.2);
      const a = dao(c, 'sine', 220, t, dai + 0.3, n); a.frequency.exponentialRampToValueAtTime(880, t + dai);
      const vib = c.createOscillator(); vib.frequency.value = 9; const vg = c.createGain(); vg.gain.value = 18; vib.connect(vg); vg.connect(a.frequency); vib.start(t); vib.stop(t + dai + 0.3);
      const n2 = g(c, out, 0); n2.gain.setValueAtTime(0.0001, t); n2.gain.exponentialRampToValueAtTime(0.05, t + 0.4); n2.gain.exponentialRampToValueAtTime(0.0001, t + dai + 0.2);
      const b = dao(c, 'triangle', 1320, t, dai + 0.3, n2); b.frequency.exponentialRampToValueAtTime(2640, t + dai);
      const lf = c.createOscillator(); lf.frequency.value = 13; const lfg = c.createGain(); lfg.gain.value = 300; lf.connect(lfg); lfg.connect(b.frequency); lf.start(t); lf.stop(t + dai + 0.3);
    },
    // ── máy gắp
    motor(c, out, t, o) {
      const n = g(c, out, 0); n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.09 * (o.to ?? 1), t + 0.08);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(n);
      const a = c.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 72 * (o.cao || 1); a.connect(lp); a.start(t);
      const r = suot(c, t, 60, n, 'bandpass', 2400, 2); r.b.disconnect(); const ng = c.createGain(); ng.gain.value = 0.25; r.b.connect(ng); ng.connect(n);
      return { dung(tt) { n.gain.cancelScheduledValues(tt); n.gain.setValueAtTime(0.08, tt); n.gain.exponentialRampToValueAtTime(0.0001, tt + 0.12); a.stop(tt + 0.15); try { r.s.stop(tt + 0.15); } catch (e) {} } };
    },
    kep(c, out, t) {                                   // càng kẹp sập «cạch»
      const n = g(c, out, 0); bao(n, t, 0.001, 0.01, 0.09, 0.45); suot(c, t, 0.12, n, 'bandpass', 2100, 4);
      const n2 = g(c, out, 0); bao(n2, t, 0.001, 0, 0.12, 0.3); dao(c, 'square', 310, t, 0.15, n2);
    },
    rot(c, out, t, o) {                                // rơi «bịch»
      const n = g(c, out, 0); bao(n, t, 0.002, 0.01, 0.22, 0.7 * (o.to ?? 1));
      const x = dao(c, 'sine', 160, t, 0.3, n); x.frequency.exponentialRampToValueAtTime(48, t + 0.22);
      const m = g(c, out, 0); bao(m, t, 0.002, 0, 0.08, 0.25 * (o.to ?? 1)); suot(c, t, 0.1, m, 'lowpass', 900, 0.7);
    },
    // ── lồng cầu
    soc(c, out, t, o) {                                // hai quả cầu chạm nhau «cách»
      const n = g(c, out, 0); bao(n, t, 0.001, 0, 0.03, 0.22 * (o.to ?? 1));
      dao(c, 'sine', 2400 * (o.cao || 1), t, 0.05, n);
      const m = g(c, out, 0); bao(m, t, 0.001, 0, 0.02, 0.15 * (o.to ?? 1)); suot(c, t, 0.03, m, 'highpass', 4000, 1);
    },
    quatGio(c, out, t, o) {                            // quạt thổi lồng cầu (kéo dài)
      const n = g(c, out, 0); n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.32 * (o.to ?? 1), t + 0.6);
      const r = suot(c, t, 120, n, 'bandpass', 520, 0.6);
      const lf = c.createOscillator(); lf.frequency.value = 0.9; const lg = c.createGain(); lg.gain.value = 180; lf.connect(lg); lg.connect(r.b.frequency); lf.start(t);
      return { dung(tt) { n.gain.cancelScheduledValues(tt); n.gain.setValueAtTime(0.3, tt); n.gain.exponentialRampToValueAtTime(0.0001, tt + 0.8); try { r.s.stop(tt + 0.9); } catch (e) {} lf.stop(tt + 0.9); } };
    },
    lan(c, out, t, o) {                                // quả cầu lăn trong ống
      const dai = o.dai || 1.2, n = g(c, out, 0);
      n.gain.setValueAtTime(0.0001, t); n.gain.exponentialRampToValueAtTime(0.18, t + 0.1); n.gain.setValueAtTime(0.18, t + dai - 0.15); n.gain.exponentialRampToValueAtTime(0.0001, t + dai);
      const r = suot(c, t, dai, n, 'bandpass', 900, 3); const lf = c.createOscillator(); lf.frequency.value = 22; const lg = c.createGain(); lg.gain.value = 300;
      lf.connect(lg); lg.connect(r.b.frequency); lf.start(t); lf.stop(t + dai);
    },
    // ── câu cá
    bongBong(c, out, t, o) {
      const n = g(c, out, 0); bao(n, t, 0.003, 0, 0.07, 0.14 * (o.to ?? 1));
      const x = dao(c, 'sine', 520 * (o.cao || 1), t, 0.1, n); x.frequency.exponentialRampToValueAtTime(1500 * (o.cao || 1), t + 0.06);
    },
    toe(c, out, t, o) {                                // té nước
      const v = o.to ?? 1, n = g(c, out, 0); bao(n, t, 0.004, 0.04, 0.5, 0.6 * v);
      const { b } = suot(c, t, 0.7, n, 'bandpass', 2600, 0.8); b.frequency.exponentialRampToValueAtTime(700, t + 0.5);
      const m = g(c, out, 0); bao(m, t, 0.002, 0, 0.18, 0.4 * v); const x = dao(c, 'sine', 260, t, 0.2, m); x.frequency.exponentialRampToValueAtTime(80, t + 0.15);
    },
    cuonDay(c, out, t, o) {                            // máy câu quay «rè rè»
      const dai = o.dai || 1.5; let x = 0;
      while (x < dai) { const n = g(c, out, 0); bao(n, t + x, 0.001, 0, 0.02, 0.12); suot(c, t + x, 0.03, n, 'bandpass', 3800, 5); x += 0.028; }
    },
    giat(c, out, t) {                                  // cá đớp mồi: phao giật
      const n = g(c, out, 0); bao(n, t, 0.002, 0, 0.1, 0.3); const x = dao(c, 'sine', 700, t, 0.12, n); x.frequency.exponentialRampToValueAtTime(260, t + 0.1);
    },
    // ── đồng hồ
    quaySo(c, out, t, o) {                             // tích khi chọn thời gian
      const n = g(c, out, 0); bao(n, t, 0.001, 0, 0.025, 0.2 * (o.to ?? 1)); dao(c, 'square', 2200 * (o.cao || 1), t, 0.03, n);
    },
    chot(c, out, t) { chuong(c, out, t, 1318.5, 0.7, 0.6); chuong(c, out, t + 0.09, 1975.5, 0.6, 0.8); },
    dongHo(c, out, t, o) {                             // tiếng tích tắc
      const n = g(c, out, 0); bao(n, t, 0.001, 0, 0.04, 0.22 * (o.to ?? 1));
      suot(c, t, 0.05, n, 'bandpass', o.tac ? 2300 : 3100, 6);
    },
    tim(c, out, t, o) {                                // nhịp tim «thình thịch»
      [0, 0.17].forEach((d, i) => { const n = g(c, out, 0); bao(n, t + d, 0.004, 0.02, 0.14, (i ? 0.55 : 0.8) * (o.to ?? 1)); const x = dao(c, 'sine', 70, t + d, 0.2, n); x.frequency.exponentialRampToValueAtTime(40, t + d + 0.15); });
    },
    gap(c, out, t, o) { const n = g(c, out, 0); bao(n, t, 0.003, 0.09, 0.05, 0.2 * (o.to ?? 1)); dao(c, 'square', 1046 * (o.cao || 1), t, 0.16, n); },
    hetGio(c, out, t) {                                // còi hết giờ + cồng
      const n = g(c, out, 0); bao(n, t, 0.01, 0.75, 0.25, 0.22);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(n);
      [196, 199, 392].forEach(f => dao(c, 'sawtooth', f, t, 1.1, lp));
      trong(c, out, t, 1);
      [[1, 1], [1.48, 0.5], [2.1, 0.3]].forEach(([k, a]) => { const m = g(c, out, 0); bao(m, t + 0.05, 0.004, 0.1, 2.4 / k, 0.3 * a); dao(c, 'sine', 110 * k, t + 0.05, 2.6, m); });
    },
  };

  function dam() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); chinh = ctx.createGain(); chinh.gain.value = amLuong;
      const nen = ctx.createDynamicsCompressor(); nen.threshold.value = -14; nen.ratio.value = 4;
      chinh.connect(nen); nen.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function phat(ten, o = {}) {
    const ghi = window.__GHI_AM;
    if (ghi) {
      const id = ++dem; if (bat) ghi.push({ t: performance.now() / 1000, ten, o, id });
      return { dung() { ghi.push({ t: performance.now() / 1000, dung: id }); } };
    }
    if (!bat || !SYN[ten]) return { dung() {} };
    const c = dam(); if (!c) return { dung() {} };
    let h = null;
    try { h = SYN[ten](c, chinh, c.currentTime + 0.01, o); } catch (e) { console.warn(e); }
    return { dung() { try { h && h.dung && h.dung(c.currentTime + 0.01); } catch (e) {} } };
  }

  async function dungOffline(suKien, giay, sr = 48000) {
    const c = new OfflineAudioContext(2, Math.ceil(giay * sr), sr);
    const m = c.createGain(); m.gain.value = 0.8;

  async function thuDay() {        // giật dây khỏi nước, phao và lưỡi bay về ngọn cần
    const tk = ++lenhDay, ok = () => tk === lenhDay;
    if (day.kieu === 'nuoc') { G.am('toe', { to: .16 }); gon(phao.x, 1); botTai(luoi.x, luoi.y, 3); }
    G.am('whoosh', { dai: .25, cao: 1.7, to: .3 });
    day.kieu = 'bay';
    const x0 = phao.x, y0 = phao.y, lx0 = luoi.x, ly0 = luoi.y;
    await G.hoat(260, (e, p) => {
      if (!ok()) return;
      const tx = day.nx, ty = day.ny + 30 * u;
      phao.x = lerp(x0, tx, e); phao.y = lerp(y0, ty, e) - Math.sin(p * Math.PI) * 50 * u; phao.goc = 0;
      luoi.x = lerp(lx0, tx, e); luoi.y = lerp(ly0, ty + 24 * u, e) - Math.sin(p * Math.PI) * 36 * u;
    }, E.vaoRa);
    if (ok()) datTreo();
  }
  function datNghi() {             // lúc chờ: phao nổi trên mặt nước, mồi lơ lửng ngay dưới
    lenhDay++;
    day.kieu = 'nuoc'; day.chung = 1; day.sau = yN + 72 * u; phao.dy = 0; phao.vy = 0; luoi.dx = 0; luoi.vdx = 0;
    phao.x = moi.x; luoi.x = moi.x; luoi.y = day.sau;
  }
  function lapLich(a, b, coKhach) {
    const ds = [], tong = b - a;
    if (tong < 420 || !coKhach) return ds;
    const n = Math.max(1, Math.round(tong / 900));
    const w = Array.from({ length: n }, (_, i) => n > 1 ? lerp(1.4, .62, Math.pow(i / (n - 1), .85)) : 1), sw = w.reduce((x, y) => x + y, 0);
    let t = a;
    for (let i = 0; i < n; i++) { const dur = tong * w[i] / sw, lead = kep(dur * .42, 260, 560); ds.push({ bd: t - 140, lead, giu: dur - lead + 60, muc: n >= 4 && i === 1 }); t += dur; }
    return ds;
  }
  let khachTruoc = null;
  function chonKhach(dam, muc) {
    let ranh = dam.filter(f => f.vai === 'dam' && f.ep > .3 && f !== khachTruoc);
    if (!ranh.length) ranh = dam.filter(f => f.vai === 'dam' && f.ep > .3);
    if (!ranh.length) return null;
    const benTruoc = khachTruoc ? (khachTruoc.x < luoi.x ? -1 : 1) : 0;
    const khac = ranh.filter(f => (f.x < luoi.x ? -1 : 1) !== benTruoc);
    const ds = (khac.length ? khac : ranh).sort((a, b) => a.daTham - b.daTham || Math.random() - .5);
    return ds[0];
  }
  async function tham(v, f, my) {
    if (!f || f.vai !== 'dam' || caCau) return;
    khachTruoc = f; f.daTham++;
    if (f.ep < .98) batEp(f, 320);
    f.vai = 'tham'; f.huong = f.x < luoi.x ? 1 : -1; f.cach = 44 * u; f.k = 22;
    G.hoat(v.lead, p => { if (f.vai === 'tham') f.cach = lerp(44, 20, p) * u; }, E.ra);
    await G.cho(v.lead);
    const soLan = v.giu > 1000 ? 3 : v.giu > 560 ? 2 : 1, nhip = v.giu / soLan;
    for (let j = 0; j < soLan; j++) {
      if (my !== phien || f.vai !== 'tham' || caCau) return;
      f.k = 95; const lao = Math.min(150, nhip * .38);
      G.hoat(lao, p => { if (f.vai === 'tham') { f.cach = lerp(20, 1, p) * u; f.mieng = p * .7; } }, E.vao);
      await G.cho(lao);
      if (f.vai !== 'tham' || caCau) return;
      riaMoi(.45 + Math.random() * .45); f.mieng = 0;
      f.k = 40; G.hoat(nhip - lao, p => { if (f.vai === 'tham') f.cach = lerp(1, 22, p) * u; }, E.ra);
      await G.cho(nhip - lao);
    }
    if (f.vai === 'tham' && !caCau) { f.vai = 'dam'; f.k = 12; }
  }
  async function lua(dam, muc, ms, my) {
    const benMuc = muc.x < luoi.x ? -1 : 1;
    let ds = dam.filter(f => f.vai === 'dam' && f.ep > .5 && (f.x < luoi.x ? -1 : 1) !== benMuc);
    if (!ds.length) ds = dam.filter(f => f.vai === 'dam' && f.ep > .5);
    const f = ds.sort((a, b) => kcMoi(a) - kcMoi(b))[0];
    if (!f) { await G.cho(ms); return; }
    if (f.ep < .98) batEp(f, 320);
    f.vai = 'tham'; f.huong = f.x < luoi.x ? 1 : -1; f.cach = 44 * u; f.k = 20;
    await G.hoat(ms * .4, p => { if (f.vai === 'tham') f.cach = lerp(44, 14, p) * u; }, E.ra);
    if (my !== phien || f.vai !== 'tham') return;
    G.am('tim', { to: .75 }); f.k = 30;
    await G.hoat(ms * .36, p => { if (f.vai === 'tham') { f.mieng = E.ra(p); f.cach = lerp(14, 4, p) * u; } });
    if (my !== phien || f.vai !== 'tham') return;
    phao.vy += 70 * u; phao.sang = .6; luoi.lac = 1;
    // quay đi!
    f.mieng = 0; f.vai = 'roi'; f.hEp = -f.huong; f.k = 26; f.duoiNhanh = 2.8;
    f.tx = f.x - f.huong * 380 * u; f.ty = kep(f.y + (Math.random() < .5 ? -1 : 1) * 100 * u, yTop, yBot);
    G.am('whoosh', { dai: .3, cao: 1.7, to: .35 }); botTai(f.x, f.y, 5);
    await G.cho(ms * .24);
    const tk = f.tok; G.cho(250).then(() => { if (f.vai === 'roi' && f.tok === tk) roiDam(f); });
  }
  function doiDam(dam, muc) {
    const di = tron(dam.filter(f => f.vai === 'dam' && f !== muc)).slice(0, 2);
    if (!di.length) return;
    const moiDs = tron(ca.filter(f => f.trang === 'boi' && !f.vai && f.ep < .05 && f !== muc).sort((a, b) => kcMoi(a) - kcMoi(b)).slice(0, 6)).slice(0, di.length);
    di.forEach((f, i) => {
      const n = moiDs[i]; if (!n) return;
      roiDam(f); dam.splice(dam.indexOf(f), 1);
      n.hx = f.hx; n.hy = f.hy; dam.push(n);
    });
    tapHop(moiDs, true);
  }
  function vaoXo(f) {
    const tk = ++f.tok, x0 = f.ax, y0 = f.ay, tl0 = f.atl;
    f.trang = 'vaoXo'; f.xo = ++demXo; f.nay = 0; f.flop = 0; f.sy2 = 1;
    G.am('pop', { cao: 1.2, to: .6 });
    G.hoat(460, p => {
      if (f.tok !== tk) return;
      const [bx, by] = tuTau(-176, -64);
      f.ax = lerp(x0, bx, p); f.ay = lerp(y0, by, p) - Math.sin(p * Math.PI) * 70 * u; f.atl = lerp(tl0, .45, p); f.agoc = lerp(0, -1.3, p);
      if (p >= 1) f.trang = 'xo';
    }, E.vaoRa);
  }
  async function chon(hs, { giay }) {
    const muc = ca.find(f => f.hs.ten === hs.ten);
    if (!muc) return;
    const my = ++phien;
    donTraVe();
    ca.forEach(f => { if (f.trang === 'boong') vaoXo(f); });
    if (muc.trang !== 'boi') return;
    dangChon = true; nhanLon = null; cham = null; caCau = null; khachTruoc = null;
    meo.mat = 'thuong';
    if (cam.z !== 1) { const z0 = cam.z; G.hoat(500, p => { if (phien === my) cam.z = lerp(z0, 1, p); }, E.vaoRa); }
    G.hoat(700, p => { if (dangChon) toiNuoc = Math.max(toiNuoc, p); });
    const t0 = performance.now(), T = Math.max(2300, giay * 1000);
    const den = ms => G.cho(Math.max(0, t0 + ms - performance.now()));
    const dam = chonDam(muc, Math.min(ca.length - 1, Math.round(3 + Math.min(3, giay / 3))));
    if (day.kieu !== 'treo') await thuDay();
    await quang(moi.y, false);
    if (my !== phien) return;
    datCho(dam.concat([muc])); tapHop(dam.concat([muc]), true);
    const coLua = T >= 3000 && dam.length > 0;
    const tDash = T - 470, tLua = coLua ? tDash - (T >= 4500 ? 1450 : 950) : tDash;
    lapLich(Math.max(1150, performance.now() - t0 + 260), tLua - 80, dam.length > 0).forEach(v => (async () => {
      await den(v.bd);
      if (my !== phien || caCau) return;
      await tham(v, v.muc && muc.vai === 'dam' ? muc : chonKhach(dam, muc), my);
    })());
    if (T >= 8500) [.4, .68].forEach((k, i) => { if (!i || T >= 12000) den(T * k).then(() => { if (my === phien && !caCau) doiDam(dam, muc); }); });
    await den(tLua);
    if (coLua) await lua(dam, muc, tDash - tLua, my);
    await den(tDash);
    if (my !== phien) return;
    // cá được chọn lao tới
    if (muc.ep < .98 && muc.trang === 'boi') batEp(muc, 300);
    muc.vai = 'tham'; muc.huong = muc.x < luoi.x ? 1 : -1; muc.k = 120; muc.cach = 0; muc.duoiNhanh = 3;
    G.am('whoosh', { dai: .35, cao: 1.25, to: .5 }); botTai(muc.x, muc.y, 4);
    G.hoat(380, p => { if (muc.vai === 'tham') muc.mieng = E.ra(p); });
    await den(T);
    if (my !== phien) return;
    // ĐỚP MỒI!
    caCau = muc; muc.tok++; muc.vai = null; muc.trang = 'cau'; muc.hEp = muc.huong; muc.mieng = 0;
    muc.ax = muc.x; muc.ay = muc.y; muc.agoc = muc.goc; muc.atl = 1; muc.ep = 0; muc.sx = muc.sy = muc.svx = muc.svy = 0; muc.duoiNhanh = 3.5;
    lenhDay++; day.kieu = 'ca'; luoi.lac = 1;
    G.am('giat'); G.am('pop', { cao: .5, to: .9 }); G.am('ting', { cao: 1.3, to: .55 });
    cham = { t0: performance.now() }; meo.mat = 'tron'; meo.tai = .4;
    can.uonDich = .55; can.uonV += 3; tau.vLac += .05;
    gon(moi.x, 3, 1.3); hoangSo(muc);
    G.hoat(450, p => { toiNuoc = Math.min(toiNuoc, 1 - p); });
    { const xa = muc.ax, ya = muc.ay, ga = muc.agoc;   // giãy giụa tại chỗ
      await G.hoat(360, (e, p) => { const tt = performance.now() / 1000; muc.ax = xa + Math.sin(tt * 34) * 7 * u; muc.ay = ya - p * 10 * u; muc.agoc = ga + Math.sin(tt * 26) * .35; }); }
    // kéo lên, về phía thuyền (miệng cá luôn hướng theo dây)
    G.am('cuonDay', { dai: 1.05 });
    can.quayV = 22; muc.hEp = 1;
    const gocDay = () => Math.atan2(day.ny - muc.ay, day.nx - muc.ax) + (muc.quay >= 0 ? 0 : Math.PI);
    const x0 = muc.ax, y0 = muc.ay, g0 = muc.agoc, xS = tau.x + 228 * u, yS = yN + 34 * u;
    G.hoat(300, p => { meo.nga = lerp(0, -.15, p); }, E.ra);
    await G.hoat(1020, (e, p) => {
      const tt = performance.now() / 1000;
      muc.ax = lerp(x0, xS, e) + Math.sin(tt * 10) * 20 * u * (1 - e * .4);
      muc.ay = lerp(y0, yS, e);
      muc.agoc = lerp(g0, gocDay(), Math.min(1, p * 2.5)) + Math.sin(tt * 17) * .3;
      can.uonDich = .48 + Math.sin(tt * 13) * .1; tau.lac = Math.sin(tt * 9) * .012;
      if (Math.random() < .25) botTai(muc.ax, muc.ay, 1);
    }, E.vaoRa);
    can.quayV = 0;
    // TÉ NƯỚC!
    G.am('toe', { to: 1 }); toeNuoc(muc.ax, yN, 1);
    G.am('whoosh', { dai: .85, cao: 1.05, to: .6 });
    const px0 = muc.ax, py0 = yN - 8 * u, z0 = cam.z;
    cam.fx = tau.x - 60 * u; cam.fy = 80;
    muc.sauMeo = true; cham = null;
    let tre = 0;
    await G.hoat(900, (e, p) => {
      const [dx, dy] = tuTau(-96, -66), apex = yN - 160 * u, cy = 2 * apex - (py0 + dy) / 2, cx = lerp(px0, dx, .68);
      muc.ax = bez(px0, cx, dx, p); muc.ay = bez(py0, cy, dy, p);
      const tt = performance.now() / 1000, ve0 = kep((p - .62) / .38, 0, 1);
      muc.agoc = lerp(gocDay(), 0, ve0 * ve0 * (3 - 2 * ve0)) + Math.sin(tt * 15) * .28 * (1 - p);
      muc.atl = lerp(1, 1.14, p);
      can.goc = -.15 - Math.sin(p * Math.PI) * .55; can.uonDich = lerp(.45, .1, p); meo.nga = lerp(-.15, -.05, p);
      cam.z = lerp(z0, 1.12, E.vaoRa(p));
      if (p > tre) { tre = p + .07; GIOT.push({ x: muc.ax, y: muc.ay, vx: (Math.random() - .5) * 80 * u, vy: 40 * u, r: (2 + Math.random() * 3) * u, song: 0 }); if (p > .3) lapLanh(muc.ax, muc.ay, 1); }
    });
    // ĐÁP XUỐNG THUYỀN
    muc.trang = 'boong'; muc.nay = 0; muc.flop = 0; muc.agoc = 0; muc.hEp = 1; muc.sauMeo = false;
    G.am('rot', { to: .6 }); G.am('ting', { cao: 1.6, to: .75 }); G.am('pop', { cao: 1.3, to: .6 });
    lapLanh(muc.ax, muc.ay, 30);
    nhanLon = { f: muc, t0: performance.now() };
    cham = null; meo.mat = 'cuoi'; can.uonDich = 0; caCau = null;
    const cg = can.goc; G.hoat(420, p => { can.goc = lerp(cg, -.15, p); meo.nga = lerp(-.05, 0, p); }, E.ra);
    datTreo();
    G.hoat(650, (e, p) => { if (muc.trang !== 'boong') return; muc.nay = Math.abs(Math.sin(p * Math.PI * 2)) * (1 - p) * 26; muc.flop = Math.sin(p * Math.PI * 4) * .22 * (1 - p); muc.sy2 = 1 - .14 * Math.sin(p * Math.PI * 4) * (1 - p); });
    let lt = 0; G.hoat(2200, p => { if (p > lt && nhanLon && nhanLon.f === muc) { lt = p + .06; lapLanh(muc.ax + (Math.random() - .5) * 120 * u, muc.ay + (Math.random() - .5) * 60 * u, 1); } });
    await G.cho(560);
    dangChon = false;
  }

  // ───────────────────────── trả cá về biển ─────────────────────────
  function veNuoc(f, x, y) {
    f.tok++; f.trang = 'boi'; f.vai = null; f.ep = 1; f.ox = x; f.oy = y; f.ovx = -40 * u; f.ovy = 220 * u; f.tx = x - 70 * u; f.ty = y + 160 * u; f.k = 5; f.hEp = 0;
    f.sx = f.sy = f.svx = f.svy = 0; f.atl = 1; f.sy2 = 1; f.xo = 0; f.agoc = 0; f.sauMeo = false;
    roiDam(f);
  }
  function donTraVe() {
    if (!dangTra) return;
    dangTra = false; phienTra++;
    ca.forEach(f => {
      if (f.trang === 'tha') veNuoc(f, f.ax, Math.max(f.ay, yN + 30 * u));
      else if (f.trang === 'boong' || f.trang === 'xo' || f.trang === 'vaoXo') veNuoc(f, tau.x - 250 * u, yN + 40 * u);
    });
  }
  async function thaCa(f, i, my) {
    const tk = ++f.tok, x0 = f.ax, y0 = f.ay, tl0 = f.atl;
    const xs = Math.max(co.l * .6, tau.x - (255 + i * 58) * u), ys = yN;
    f.trang = 'tha'; f.hEp = -1; f.nay = 0; f.flop = 0; f.sy2 = 1;
    G.am('whoosh', { dai: .4, cao: 1.4, to: .35 });
    meo.tay = 1; G.hoat(420, p => { meo.tay = 1 - p; });
    await G.hoat(640, p => {
      if (f.tok !== tk) return;
      f.ax = lerp(x0, xs, p); f.ay = lerp(y0, ys, p) - Math.sin(p * Math.PI) * 120 * u; f.agoc = lerp(.5, -.9, p); f.atl = lerp(tl0, 1, p);
    });
    if (f.tok !== tk || my !== phienTra) return;
    G.am('toe', { to: .42 }); toeNuoc(xs, ys, .38);
    veNuoc(f, xs, ys + 12 * u);
  }
  async function traVe() {
    const my = ++phienTra;
    dangTra = true;
    nhanLon = null; cham = null; toiNuoc = 0;
    if (cam.z !== 1) { const z0 = cam.z; G.hoat(700, p => { if (phienTra === my) cam.z = lerp(z0, 1, p); }, E.vaoRa); }
    const ds = ca.filter(f => f.trang === 'boong' || f.trang === 'xo' || f.trang === 'vaoXo').sort((a, b) => (a.trang === 'boong') - (b.trang === 'boong') || a.xo - b.xo);
    if (ds.length) {
      meo.mat = 'cuoi';
      for (let i = 0; i < ds.length; i++) {
        if (my !== phienTra || dangChon) return;
        thaCa(ds[i], i, my);
        await G.cho(320);
      }
      await G.cho(700);
    }
    if (my !== phienTra || dangChon) return;
    meo.mat = 'thuong'; dangTra = false;
    if (day.kieu === 'treo') quang(yN + 72 * u, true);      // thả câu chờ lượt sau
  }

  G.troChoi({
    id: 'cau-ca', ten: 'Câu cá vàng', bieuTuong: '🎣',
    mau: { chinh: '#FFC93C', chinh2: '#FF8A1F', phu: '#06B6D4', sang: '#A5F3FC' },
    chuThich: '🎣 Chờ cá cắn câu…',
    khoiTao() { datNghi(); },
    datDanhSach(ds) {
      const cu = new Map(ca.map(f => [f.hs.ten, f]));
      ca = ds.map(hs => { const f = cu.get(hs.ten) || taoCa(hs); f.hs = hs; return f; });
      const kyCu = kyHieuXep;
      const giuLan = xepLan(false);
      if (!giuLan && kyCu && kyCu !== kyHieuXep) ca.forEach(f => {      // danh sách đổi hẳn: cá lướt êm sang chỗ mới
        if (f.trang !== 'boi' || f.vai || f.ep > .01 || f.px == null) return;
        f.ox = f.tx = f.x - f.sx; f.oy = f.ty = f.y - f.sy; f.ovx = f.ovy = 0; f.k = 4; f.ep = 1; thaEp(f, 1500);
      });
      ca.forEach(lamSprite);
    },
    doiKichThuoc(w, h) {
      W = w; H = h; boCuc(); veNen(); xepLan(true); ca.forEach(lamSprite);
      cam.fx = tau.x; cam.fy = yN;
      const hc = hinhCan(); [day.nx, day.ny] = tuTau(hc.p2[0], hc.p2[1]);
      if (day.kieu === 'treo') datTreo(); else if (!dangChon && day.kieu === 'nuoc') datNghi();
    },
    ve, chon, traVe,
  });
})();
</script>
