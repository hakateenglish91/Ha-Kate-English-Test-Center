  --mo:rgba(255,255,255,.72); --mo2:rgba(255,255,255,.5);
  --xanh:#2FD27F; --xanh2:#159957; --do:#FF4D6D; --do2:#D61F45;
  --bong:0 1.2rem 3rem rgba(0,0,0,.5);
  --cot:clamp(240px,17.5vw,350px);
}
html{font-size:clamp(11px,min(1.07vw,1.9vh),24px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0920;color:#fff;
  font-family:'BVP','Segoe UI',Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit;color:inherit}
canvas.lop{position:fixed;inset:0;width:100%;height:100%;display:block}
#san{z-index:0}
#bay{z-index:60;pointer-events:none}
.an{display:none!important}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.dac{fill:currentColor;stroke:none}
.man{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s}
.man.mo{opacity:1;pointer-events:auto}

/* ───────── nút ───────── */
.nut{appearance:none;border:1px solid var(--vien);background:rgba(20,20,56,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-weight:700;font-size:.8rem;padding:.55rem .85rem;border-radius:.75rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s,filter .15s;white-space:nowrap;line-height:1.1;color:#fff}
.nut:hover{background:rgba(48,48,110,.88);border-color:var(--vien2);transform:translateY(-1px)}
.nut:active{transform:translateY(1px) scale(.97)}
.nut.lon{font-size:1rem;padding:.75rem 1.2rem;border-radius:.95rem}
.nut.chinh{background:linear-gradient(180deg,var(--vang3),var(--vang) 45%,var(--vang2));color:#3a1d00;border-color:transparent;
  box-shadow:0 .25rem 0 #9a4300,0 .5rem 1.2rem rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.nut.chinh:hover{filter:brightness(1.07)}
.nut.xanh{background:linear-gradient(180deg,#5BE79A,var(--xanh) 50%,var(--xanh2));border-color:transparent;color:#03301a;box-shadow:0 .25rem 0 #0a5c34,0 .5rem 1.2rem rgba(0,0,0,.3)}
.nut.do{background:linear-gradient(180deg,#FF8095,var(--do) 50%,var(--do2));border-color:transparent;box-shadow:0 .25rem 0 #7a0a22,0 .5rem 1.2rem rgba(0,0,0,.3)}
.nut.trong{background:transparent;border-color:transparent;backdrop-filter:none}
.nut.trong:hover{background:rgba(255,255,255,.08)}
.nut[disabled]{opacity:.4;pointer-events:none}
.nut .phim{font-size:.6rem;font-weight:800;letter-spacing:.05em;padding:.15rem .35rem;border-radius:.35rem;background:rgba(0,0,0,.2);opacity:.8}
.nut.chinh .phim,.nut.xanh .phim{background:rgba(60,20,0,.15)}
.nut-tron{width:2.4rem;height:2.4rem;padding:0;border-radius:.8rem}

/* ───────── logo ───────── */
.logo{display:flex;align-items:center;gap:.65rem;min-width:0}
.logo .bt{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--vang3),var(--vang2) 55%,#E8590C);box-shadow:0 .4rem 1rem rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.logo .bt svg{width:1.7rem;height:1.7rem}
.logo b{display:block;font-weight:900;font-size:1.15rem;line-height:1.05;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.logo small{display:block;font-weight:700;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--vang);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22rem}

/* ───────── lớp phủ, hộp ───────── */
.phu{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(6,6,26,.6),rgba(3,3,14,.88));
  opacity:0;pointer-events:none;transition:opacity .25s}
.phu.mo{opacity:1;pointer-events:auto}
.hop{background:var(--kinh2);border:1px solid var(--vien2);border-radius:1.3rem;box-shadow:var(--bong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.phu .hop{transform:translateY(1rem) scale(.97);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.phu.mo .hop{transform:none}
.dau-hop{display:flex;align-items:center;gap:.6rem;padding:1rem 1.2rem .7rem}
.dau-hop h2{font-weight:900;font-size:1.2rem;margin-right:auto;display:flex;align-items:center;gap:.5rem}
.dau-hop h2 svg.i{color:var(--vang);width:1.4rem;height:1.4rem}
.dong-x{width:2.1rem;height:2.1rem;border-radius:.65rem;display:grid;place-items:center;border:1px solid var(--vien);background:rgba(255,255,255,.05);cursor:pointer;flex:none}
.dong-x:hover{background:rgba(255,255,255,.14)}
.chan-hop{display:flex;align-items:center;gap:.6rem;padding:.8rem 1.2rem 1rem}
.chan-hop .ghi{margin-right:auto}
.ghi{font-size:.72rem;color:var(--mo);font-weight:600;line-height:1.45}
.ghi b{color:#fff}
#bao{position:fixed;left:50%;top:4.4rem;z-index:90;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#bao div{padding:.6rem 1rem;border-radius:.8rem;background:rgba(16,16,44,.94);border:1px solid var(--vien2);font-weight:800;font-size:.85rem;box-shadow:var(--bong);
  animation:baoVao .35s cubic-bezier(.2,1.4,.4,1) both;max-width:80vw;text-align:center}
#bao div.loi{border-color:rgba(255,77,109,.6);background:rgba(60,8,22,.95)}
@keyframes baoVao{0%{transform:translateY(-.8rem);opacity:0}100%{transform:none;opacity:1}}
input.o,textarea.o,select.o{width:100%;background:rgba(0,0,0,.26);border:1px solid var(--vien2);border-radius:.65rem;font-weight:700;font-size:.85rem;padding:.55rem .7rem;outline:0;
  user-select:text;-webkit-user-select:text;transition:border-color .15s,background .15s}
input.o:focus,textarea.o:focus,select.o:focus{border-color:var(--vang);background:rgba(0,0,0,.36)}
input.o::placeholder,textarea.o::placeholder{color:var(--mo2);font-weight:600}
textarea.o{resize:none;line-height:1.5}
select.o option{background:#1b1a44}
.doan{display:flex;flex-wrap:wrap;gap:.35rem}
.doan button{appearance:none;border:1px solid var(--vien2);background:rgba(255,255,255,.05);font-weight:800;font-size:.78rem;padding:.45rem .7rem;border-radius:.6rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.doan button:hover{background:rgba(255,255,255,.12)}
.doan button.chon{background:linear-gradient(180deg,var(--vang3),var(--vang2));color:#3b1700;border-color:transparent}
.cong-tac{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:.8rem;cursor:pointer;padding:.3rem 0;line-height:1.35}
.cong-tac input{display:none}
.cong-tac i{width:2.5rem;height:1.4rem;border-radius:99px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.cong-tac i::after{content:"";position:absolute;left:.15rem;top:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:transform .2s}
.cong-tac input:checked+i{background:var(--xanh)}
.cong-tac input:checked+i::after{transform:translateX(1.1rem)}
.dem{display:inline-flex;align-items:center;border:1px solid var(--vien2);border-radius:.65rem;overflow:hidden;background:rgba(0,0,0,.2)}
.dem button{appearance:none;border:0;background:transparent;width:2rem;height:2rem;font-weight:900;font-size:1rem;cursor:pointer}
.dem button:hover{background:rgba(255,255,255,.1)}
.dem b{min-width:2.2rem;text-align:center;font-size:.9rem;font-weight:900}
input[type=range]{width:100%;accent-color:var(--vang)}

/* ───────── THƯ VIỆN ───────── */
#manTV{overflow:auto;padding:1.4rem 2.2rem 2rem}
.dau-tv{display:flex;align-items:center;gap:1rem;margin-bottom:1.3rem}
.dau-tv .logo .bt{width:3.6rem;height:3.6rem;border-radius:1.1rem}
.dau-tv .logo .bt svg{width:2.4rem;height:2.4rem}
.dau-tv .logo b{font-size:2rem}
.dau-tv .logo small{font-size:.72rem;max-width:none}
.dau-tv .cach{margin-left:auto;display:flex;gap:.5rem}
.luoi-tv{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.1rem}
.the-bo{position:relative;border-radius:1.2rem;overflow:hidden;background:var(--kinh);border:1px solid var(--vien);box-shadow:0 .8rem 2rem rgba(0,0,0,.35);
  display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
.the-bo:hover{transform:translateY(-4px);border-color:var(--vien2);box-shadow:0 1.2rem 2.6rem rgba(0,0,0,.45)}
.the-bo canvas{display:block;width:100%;aspect-ratio:16/9;background:#100e2c;cursor:pointer}
.the-bo .ruot{padding:.7rem .9rem .85rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.the-bo h3{font-weight:900;font-size:1rem;line-height:1.25}
.the-bo .chi{display:flex;flex-wrap:wrap;gap:.35rem}
.the-bo .chi span{font-size:.62rem;font-weight:800;padding:.18rem .45rem;border-radius:.4rem;background:rgba(255,255,255,.08);color:var(--mo)}
.the-bo .chi span.do{background:rgba(255,201,60,.16);color:var(--vang)}
.the-bo .hang{display:flex;gap:.4rem;margin-top:auto;padding-top:.25rem}
.the-bo .hang .nut.chinh{flex:1}
.the-bo .nhan-mau{position:absolute;top:.6rem;left:.6rem;font-size:.6rem;font-weight:900;letter-spacing:.1em;padding:.22rem .5rem;border-radius:.4rem;background:rgba(10,10,30,.75);color:var(--vang);border:1px solid rgba(255,201,60,.4)}
.the-moi{border:2px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.03);display:grid;place-items:center;text-align:center;cursor:pointer;min-height:16rem;padding:1rem}
.the-moi:hover{border-color:var(--vang);background:rgba(255,201,60,.06)}
.the-moi .cong{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;margin:0 auto .7rem;background:linear-gradient(180deg,var(--vang3),var(--vang2));color:#3a1d00;box-shadow:0 .3rem 0 #9a4300}
.the-moi .cong svg{width:2rem;height:2rem;stroke-width:3}
.the-moi b{font-size:1.05rem;font-weight:900}
.the-moi small{display:block;color:var(--mo);font-weight:600;font-size:.72rem;margin-top:.3rem;line-height:1.4}
.menu-nho{position:fixed;z-index:95;min-width:13rem;padding:.35rem;border-radius:.9rem;background:rgba(22,21,58,.97);border:1px solid var(--vien2);box-shadow:var(--bong)}
.menu-nho button{display:flex;width:100%;align-items:center;gap:.55rem;appearance:none;border:0;background:transparent;font-weight:700;font-size:.8rem;padding:.55rem .7rem;border-radius:.6rem;cursor:pointer;text-align:left}
.menu-nho button:hover{background:rgba(255,255,255,.09)}
.menu-nho button.do{color:#FF8FA3}
.menu-nho hr{border:0;border-top:1px solid var(--vien);margin:.3rem .2rem}
.tv-trong{grid-column:1/-1;text-align:center;color:var(--mo);font-weight:700;padding:1rem}

/* ───────── SOẠN ───────── */
#manSoan{display:flex;flex-direction:column;background:rgba(8,8,26,.55)}
.dau-soan{display:flex;align-items:center;gap:.7rem;padding:.75rem 1.4rem;background:rgba(10,10,32,.78);border-bottom:1px solid var(--vien);backdrop-filter:blur(14px)}
.dau-soan .ten-bo{flex:1;min-width:8rem;max-width:34rem;font-size:1.05rem;font-weight:900;background:transparent;border:1px solid transparent;padding:.45rem .6rem}
.dau-soan .ten-bo:hover{border-color:var(--vien)}
.trang-thai{font-size:.68rem;font-weight:700;color:var(--mo2);display:flex;align-items:center;gap:.3rem;margin-right:auto}
.trang-thai.ok{color:#7EE8B0}
.the-tab{display:flex;gap:.4rem;padding:.75rem 1.4rem 0}
.the-tab button{appearance:none;border:1px solid var(--vien);border-bottom:0;background:rgba(255,255,255,.04);font-weight:800;font-size:.85rem;padding:.65rem 1.1rem;
  border-radius:.85rem .85rem 0 0;cursor:pointer;display:flex;align-items:center;gap:.5rem;color:var(--mo)}
.the-tab button i{font-style:normal;width:1.4rem;height:1.4rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:.7rem;font-weight:900}
.the-tab button.chon{background:rgba(30,28,76,.92);color:#fff;border-color:var(--vien2)}
.the-tab button.chon i{background:var(--vang);color:#3a1d00}
.the-tab button .so{font-size:.65rem;font-weight:800;padding:.1rem .4rem;border-radius:.4rem;background:rgba(255,255,255,.12)}
.the-tab button .so.canh{background:rgba(255,77,109,.3);color:#FFC2CD}
.ruot-soan{flex:1;min-height:0;overflow:auto;margin:0 1.4rem 1.2rem;background:rgba(30,28,76,.92);border:1px solid var(--vien2);border-radius:0 1rem 1rem 1rem;padding:1.1rem 1.3rem}
.thanh-cong-cu{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.thanh-cong-cu .ghi{margin-left:auto}
.ds-cau{display:flex;flex-direction:column;gap:.7rem}
.the-cau{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.7rem;padding:.8rem;border-radius:.95rem;background:rgba(0,0,0,.18);border:1px solid var(--vien)}
.the-cau.loi{border-color:rgba(255,77,109,.55)}
.the-cau .stt{width:2.4rem;height:2.4rem;border-radius:.7rem;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:rgba(255,201,60,.16);color:var(--vang)}
.the-cau .stt.du{background:rgba(255,255,255,.08);color:var(--mo2);font-size:.6rem;text-align:center;line-height:1.05}
.the-cau .giua{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.the-cau textarea.hoi{min-height:2.6rem;font-size:.9rem}
.the-cau .ds-pa{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.pa-o{display:flex;align-items:center;gap:.45rem}
.pa-o .chu{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none;cursor:pointer;
  background:rgba(255,255,255,.1);border:2px solid transparent;transition:background .15s,border-color .15s}
.pa-o .chu:hover{border-color:var(--xanh)}
.pa-o.dung .chu{background:var(--xanh);color:#03301a;box-shadow:0 0 0 3px rgba(47,210,127,.25)}
.pa-o.dung input{border-color:rgba(47,210,127,.7)}
.the-cau .ben{display:flex;flex-direction:column;gap:.35rem;align-items:flex-end}
.the-cau .ben .hang{display:flex;gap:.3rem}
.loai-cau{display:inline-flex;border:1px solid var(--vien2);border-radius:.6rem;overflow:hidden}
.loai-cau button{appearance:none;border:0;background:transparent;font-weight:800;font-size:.66rem;padding:.35rem .55rem;cursor:pointer;color:var(--mo)}
.loai-cau button.chon{background:rgba(255,201,60,.2);color:var(--vang)}
.anh-cau{position:relative;width:7.5rem;border-radius:.6rem;overflow:hidden;border:1px solid var(--vien2)}
.anh-cau img{display:block;width:100%}
.anh-cau button{position:absolute;top:.2rem;right:.2rem}
.dap-an-o{display:flex;align-items:center;gap:.5rem}
.dap-an-o b{font-size:.72rem;color:var(--xanh);white-space:nowrap}
.canh-bao-cau{font-size:.68rem;color:#FFB3C1;font-weight:700}
.hai-cot{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.khoi{margin-bottom:1.15rem}
.khoi h3{font-size:.7rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--vang);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.khoi .ghi{margin-top:.35rem}
.khung-anh{position:relative;border-radius:1rem;overflow:hidden;background:#0d0c26;border:1px solid var(--vien2);aspect-ratio:16/9;cursor:grab}
.khung-anh:active{cursor:grabbing}
.khung-anh canvas{display:block;width:100%;height:100%}
.khung-anh .goi-y-keo{position:absolute;left:.6rem;bottom:.6rem;font-size:.65rem;font-weight:800;padding:.3rem .55rem;border-radius:.45rem;background:rgba(0,0,0,.55);pointer-events:none}
.khung-anh .trong-anh{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mo);font-weight:700;font-size:.85rem;padding:1rem;line-height:1.5;pointer-events:none}
.khung-anh.keo-tha{outline:3px dashed var(--vang);outline-offset:-6px}
.hang-nut{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.6rem;align-items:center}
.o-tu-khoa{font-size:1.4rem!important;font-weight:900!important;letter-spacing:.06em;text-transform:uppercase;padding:.6rem .8rem!important}
.kieu-o{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.kieu-o button{appearance:none;border:2px solid var(--vien);background:rgba(255,255,255,.04);border-radius:.85rem;padding:.4rem .4rem .55rem;cursor:pointer;font-weight:800;font-size:.75rem;display:flex;flex-direction:column;gap:.35rem;align-items:center}
.kieu-o button canvas{width:100%;aspect-ratio:16/9;border-radius:.5rem;display:block}
.kieu-o button.chon{border-color:var(--vang);background:rgba(255,201,60,.1)}
.doi-o{display:flex;flex-direction:column;gap:.4rem}
.doi-o .dong{display:flex;align-items:center;gap:.5rem}
.doi-o .cham{width:1.3rem;height:1.3rem;border-radius:.4rem;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.luoi-cai{display:grid;grid-template-columns:repeat(auto-fit,minmax(24rem,1fr));gap:1.1rem 2.2rem}
.dong-cai{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.35rem 0;font-weight:700;font-size:.8rem}
.dong-cai .bt{width:1.6rem;height:1.6rem;display:grid;place-items:center;flex:none}
.dong-cai span{margin-right:auto;display:flex;align-items:center;gap:.5rem}

/* hộp dán câu hỏi */
#phuDan .hop{width:min(72rem,96vw);height:min(44rem,94vh);display:flex;flex-direction:column}
.than-dan{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:0 1.2rem}
.than-dan .cot{display:flex;flex-direction:column;min-height:0;gap:.4rem}
.than-dan textarea{flex:1;min-height:0;font-size:.8rem;font-weight:600}
.xem-dan{flex:1;min-height:0;overflow:auto;border:1px dashed var(--vien2);border-radius:.8rem;padding:.6rem;display:flex;flex-direction:column;gap:.45rem}
.xem-dan .c{padding:.5rem .65rem;border-radius:.6rem;background:rgba(255,255,255,.06);font-size:.74rem;font-weight:700;line-height:1.4}
.xem-dan .c b{color:var(--vang);margin-right:.3rem}
.xem-dan .c .pa{display:flex;flex-wrap:wrap;gap:.25rem .8rem;margin-top:.25rem;color:var(--mo);font-weight:600}
.xem-dan .c .pa .d{color:#7EE8B0;font-weight:800}
.xem-dan .c .da{color:#7EE8B0;margin-top:.2rem}
.xem-dan .c.thieu{outline:1px solid rgba(255,77,109,.6)}
.xem-dan .rong{color:var(--mo2);font-weight:600;font-size:.78rem;line-height:1.6;padding:.6rem}
.nhan-cot{font-size:.65rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--vang)}

/* ───────── CHƠI ───────── */
#manChoi{display:grid;grid-template-columns:1fr var(--cot);grid-template-rows:4rem 1fr 6.4rem;gap:0 1rem;padding:0 1.2rem 1rem 1.2rem}
#trenChoi{grid-column:1/-1;display:flex;align-items:center;gap:.6rem;padding-top:.15rem}
#trenChoi .logo{margin-right:auto;max-width:30%}
.vien-luot{position:absolute;left:50%;top:.55rem;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem .35rem 1rem;border-radius:999px;
  background:rgba(14,13,40,.82);border:1px solid var(--vien2);font-weight:800;font-size:.85rem;white-space:nowrap;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.35);transition:opacity .3s}
.vien-luot .chip{padding:.38rem .9rem;border-radius:999px;font-weight:900;font-size:.95rem;background:var(--m,#555);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 1.2rem color-mix(in srgb,var(--m,#555) 60%,transparent)}
.vien-luot.nhay .chip{animation:nhay 1.6s ease-in-out infinite}
@keyframes nhay{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#vungBan{grid-column:1;grid-row:2;position:relative;min-height:0}

  background:linear-gradient(100deg,color-mix(in srgb,var(--m) 62%,#15103a),color-mix(in srgb,var(--m) 22%,#120e34) 72%);border:1px solid color-mix(in srgb,var(--m) 65%,transparent);
  box-shadow:0 .5rem 1.4rem rgba(0,0,0,.3);transition:transform .25s,box-shadow .25s,border-color .25s;cursor:pointer;overflow:hidden}

.tien-do{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:.9rem;background:rgba(16,15,44,.75);border:1px solid var(--vien);font-weight:800;font-size:.72rem;color:var(--mo)}

/* thẻ câu hỏi */

.cau{position:relative;width:96%;height:94%;display:flex;flex-direction:column;border-radius:1.4rem;padding:1rem 1.4rem 1.1rem;

.dau-cau{display:flex;align-items:center;gap:.7rem;flex:none}

  text-shadow:0 .2rem .8rem rgba(0,0,0,.35)}

.lc:nth-child(1) .chu{background:#E8590C}.lc:nth-child(2) .chu{background:#1C7ED6}.lc:nth-child(3) .chu{background:#2F9E44}.lc:nth-child(4) .chu{background:#AE3EC9}

.lc.sai .chu{background:var(--do)}

@keyframes rung{0%,100%{transform:none}20%{transform:translateX(-.6rem)}40%{transform:translateX(.5rem)}60%{transform:translateX(-.35rem)}80%{transform:translateX(.2rem)}}
.dap-an{flex:none;display:flex;align-items:center;justify-content:center;gap:.8rem}
.dap-an .hop-da{min-width:50%;max-width:100%;padding:.75rem 1.4rem;border-radius:1rem;text-align:center;font-weight:900;font-size:1.6rem;
  background:rgba(255,255,255,.07);border:2px dashed rgba(255,255,255,.25);color:var(--mo2);letter-spacing:.02em}
.dap-an .hop-da.hien{background:rgba(47,210,127,.22);border:2px solid var(--xanh);color:#fff;animation:nayTen .5s cubic-bezier(.2,1.6,.4,1)}

.chan-cau{flex:none;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:center;padding-top:.3rem}

.thanh-gianh{flex:none;display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;padding:.7rem .9rem;margin-top:.2rem;border-radius:1rem;
  background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.45);animation:baoVao .35s cubic-bezier(.2,1.4,.4,1) both}
.thanh-gianh b{font-weight:900;font-size:1rem;margin-right:.3rem}
.nut-doi{appearance:none;border:0;cursor:pointer;font-weight:900;font-size:.95rem;padding:.6rem 1rem;border-radius:.85rem;background:var(--m);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 .3rem .9rem rgba(0,0,0,.3);transition:transform .12s}

  font-weight:900;font-size:4.2rem;line-height:1;padding:.6rem 2rem;border-radius:1.4rem;white-space:nowrap;animation:dauVao .55s cubic-bezier(.2,1.6,.4,1) both}

/* thẻ đặc biệt (ngôi sao, quà, mất lượt) */
.the-db{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;z-index:4;border-radius:inherit;
  background:radial-gradient(ellipse at center,var(--n1),var(--n2));animation:dbVao .6s cubic-bezier(.2,1.4,.4,1) both}

@keyframes dbVao{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}

@keyframes bieuNay{0%{transform:scale(0) rotate(-180deg)}100%{transform:none}}

/* đoán từ khoá */

#phuMoDau .logo{justify-content:center;margin-bottom:1rem}
#phuMoDau h1{font-weight:900;font-size:2rem;line-height:1.2;margin-bottom:.4rem}
#phuMoDau p{color:var(--mo);font-weight:700;font-size:.85rem;margin-bottom:1.2rem}

/* gọi tên nhanh: dán danh sách */
#phuDs .hop{width:min(50rem,94vw);height:min(34rem,90vh);display:flex;flex-direction:column}
#phuDs .than{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:.9rem;padding:0 1.2rem}
#phuDs textarea{height:100%}
.xem-ds{overflow:auto;border:1px dashed var(--vien2);border-radius:.8rem;padding:.5rem;display:flex;flex-wrap:wrap;gap:.3rem;align-content:flex-start}
.xem-ds span{padding:.25rem .5rem;border-radius:.45rem;background:rgba(255,255,255,.08);font-weight:700;font-size:.72rem}

/* hướng dẫn nhanh */
#phuHD .hop{width:min(62rem,95vw);max-height:92vh;overflow:auto;padding-bottom:1rem}
.buoc-hd{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;padding:0 1.2rem}
.buoc-hd div{padding:.9rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid var(--vien)}
.buoc-hd i{font-style:normal;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--vang);color:#3a1700;font-weight:900;margin-bottom:.5rem}
.buoc-hd b{display:block;font-weight:900;font-size:.9rem;margin-bottom:.3rem}
.buoc-hd span{font-size:.75rem;color:var(--mo);font-weight:600;line-height:1.45}
.phim-hd{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem 1.2rem;padding:.9rem 1.2rem 0;font-size:.78rem;font-weight:700}
.phim-hd div{display:flex;align-items:center;gap:.5rem}
kbd{font:900 .68rem 'BVP',sans-serif;padding:.15rem .45rem;border-radius:.35rem;border:1px solid var(--vien2);border-bottom-width:3px;background:rgba(255,255,255,.08);min-width:1.6rem;text-align:center;display:inline-block}

/* màn hình gần vuông (máy chiếu 4:3, 5:4): bảng điểm xuống hàng ngang dưới cùng để bàn chơi to hơn */
@media (max-aspect-ratio:3/2){
  #manChoi{grid-template-columns:1fr;grid-template-rows:3.6rem minmax(0,1fr) 4.6rem auto;padding-bottom:.6rem}
  #hangTuKhoa{grid-row:3;padding-top:.4rem}
  #cotDiem{grid-column:1;grid-row:4;flex-direction:row;align-items:stretch;padding-top:.5rem;gap:.5rem}
  .dau-diem,.tien-do{display:none}
  .ds-doi{flex-direction:row;gap:.5rem}
  .doi{min-height:3.6rem;max-height:4.4rem;padding:.35rem .7rem .35rem .95rem}
  .doi .diem{font-size:1.7rem}
  .doi.luot{transform:translateY(-.25rem)}
  .vien-luot{top:.4rem}
}
</style>
</head><body>

<script>/* Âm thanh tự tổng hợp bằng Web Audio — không cần tệp âm thanh nào, chạy được khi không có mạng.
   AmThanh.phat(ten, tuyChon) -> {dung()}      (âm kéo dài như tiếng động cơ thì gọi dung() để tắt)
   Khi quay video: đặt window.__GHI_AM = [] trước khi chạy -> chỉ ghi sự kiện, không phát;
   sau đó AmThanh.dungOffline(suKien, giay) dựng lại đúng các âm đó thành AudioBuffer. */
(() => {
  'use strict';
  let ctx = null, chinh = null, bat = true, amLuong = 0.8, dem = 0;
  const NHIEU = new WeakMap();

  function nhieu(c) {               // 2 giây nhiễu trắng, dùng chung
    let b = NHIEU.get(c);
    if (!b) {
      b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = b.getChannelData(0);
      let s = 12345;
      for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
      NHIEU.set(c, b);
    }
    return b;
  }
  function g(c, out, v = 1) { const n = c.createGain(); n.gain.value = v; n.connect(out); return n; }
  function bao(n, t, a, giu, tha, dinh = 1) {   // đường bao: lên trong a giây, giữ, tắt dần trong tha giây
    dinh = Math.max(dinh, 0.0002);
    n.gain.cancelScheduledValues(t);
    n.gain.setValueAtTime(0.0001, t);
    n.gain.exponentialRampToValueAtTime(dinh, t + Math.max(a, 0.002));
    n.gain.setValueAtTime(dinh, t + a + giu);
    n.gain.exponentialRampToValueAtTime(0.0001, t + a + giu + tha);
  }
  function dao(c, loai, f, t, dai, out) {
    const o = c.createOscillator(); o.type = loai; o.frequency.setValueAtTime(f, t);
    o.connect(out); o.start(t); o.stop(t + dai + 0.05); return o;
  }
  function suot(c, t, dai, out, loc = 'bandpass', f = 1000, q = 1) {   // nhiễu qua bộ lọc
    const s = c.createBufferSource(); s.buffer = nhieu(c); s.loop = true;
    const b = c.createBiquadFilter(); b.type = loc; b.frequency.setValueAtTime(f, t); b.Q.value = q;
    s.connect(b); b.connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dai + 0.05);
    return { s, b };
  }
  function trong(c, out, t, v = 1) {             // tiếng trống bass
    const n = g(c, out, 0); bao(n, t, 0.003, 0.02, 0.32, 0.9 * v);
    const o = dao(c, 'sine', 150, t, 0.4, n); o.frequency.exponentialRampToValueAtTime(42, t + 0.3);
  }
  function snare(c, out, t, v = 1) {
    const n = g(c, out, 0); bao(n, t, 0.002, 0.01, 0.12, 0.5 * v);
    suot(c, t, 0.16, n, 'highpass', 1400, 0.7);
    const n2 = g(c, out, 0); bao(n2, t, 0.002, 0.005, 0.07, 0.35 * v); dao(c, 'triangle', 210, t, 0.1, n2);

    const dongTab = coChu.filter(d => d.includes('\t') && boNhan(d).split('\t').filter(x => x.trim()).length >= 2);
    // dòng có tab mà các ô bắt đầu bằng nhãn «A.» là phương án đặt trong bảng của Word, không phải bảng câu hỏi
    const laDongPa = d => { const o = boNhan(d).split('\t').map(x => x.trim()).filter(Boolean); return o.length >= 2 && o.filter(x => /^\(?[A-F]\s*[.)]/.test(x)).length >= o.length - 1; };
    const bangThat = dongTab.filter(d => !laDongPa(d));
    if (bangThat.length >= Math.max(2, coChu.length * .6)) return phanTichBang(dongs);
    return phanTichChu(dongs.map(d => d.includes('\t') ? d.replace(/\t+/g, '   ') : d));
  };

  function phanTichChu(dongs) {
    const cau = [], canhBao = [];
    // bảng đáp án cuối đề: «Câu | 1 | 2 | 3…» rồi «Đáp án | B | C | A…»
    let dsDapAn = null;
    for (let k = 0; k + 1 < dongs.length; k++) {
      const a = boNhan(dongs[k]).trim().split(/\s{2,}|\t|\|/).map(x => x.trim()).filter(Boolean);
      const b = boNhan(dongs[k + 1]).trim().split(/\s{2,}|\t|\|/).map(x => x.trim()).filter(Boolean);
      if (a.length >= 3 && /^câu$/i.test(a[0]) && a.slice(1).every(x => /^\d{1,3}$/.test(x)) && /^đáp\s*án$/i.test(b[0] || '') && b.slice(1).every(x => /^[A-Fa-f]$/.test(x))) {
        dsDapAn = {}; a.slice(1).forEach((x, j) => { if (b[j + 1]) dsDapAn[+x] = b[j + 1].toUpperCase(); });
        dongs = dongs.slice(0, k).concat(dongs.slice(k + 2)); break;
      }
    }
    // Có đánh số «Câu 1, Câu 2…» thì mọi dòng trước câu đầu tiên là tiêu đề / lời dặn -> bỏ qua
    const soCauSo = dongs.filter(d => RE_CAU.test(d)).length;
    const dauCau = dongs.findIndex(d => RE_CAU.test(d));
    if (dauCau > 0 && soCauSo >= 2) dongs = dongs.slice(dauCau);
    const coCauSo = soCauSo >= 2;
    // có nhãn phương án IN HOA ở đâu đó thì «a) b) c)» chỉ là các ý trong thân câu
    const coPaHoa = dongs.some(d => /^\s*[\u0001\u0002*✓√]*\s*\(?[A-F]\s*[.)]/.test(d));
    const laPa = d => { const m = RE_PA.exec(d); return !!m && (!coPaHoa || m[2] === m[2].toUpperCase()); };
    // «câu => đáp án» chỉ dùng cho danh sách hỏi–đáp ngắn (không có «Câu n», không có phương án)
    const choMuiTen = !coCauSo && !dongs.some(d => laPa(d));
    let cur = null;
    const moi = (soThu) => { cur = { hoiTho: '', pa: [], dungTho: [], dapAn: '', so: soThu ?? null }; cau.push(cur); return cur; };
    const themPa = (s) => {
      const m = RE_PA.exec(s); if (!m) return false;
      const truoc = m[1] || '';
      let noi = s.slice(m[0].length);
      const nhanNhan = /[\u0001]/.test(truoc) && !/[\u0002]/.test(truoc);   // nhãn A. nằm trong vùng nhấn
      let dung = danhDauDung(s) || /[*✓√]/.test(truoc);
      noi = boDanhDau((nhanNhan ? MO : '') + noi);
      if (!cur) moi();
      cur.pa.push({ tho: noi, nhan: tiLeNhan(noi), nhanChu: nhanNhan || /^[\s]*\u0001/.test(s.slice(0, m[0].length + 1)) && tiLeNhan(s.slice(0, m[0].length)) > .5, dung });
      return true;
    };
    for (let raw of dongs) {
      const tho = raw.replace(/\s+$/, '');
      const s = boNhan(tho).trim();
      if (!s) continue;
      // danh sách đáp án cuối bài: «Đáp án: 1B 2C 3A» hoặc «1-B, 2-C, 3-A»
      const ds = [...s.matchAll(RE_DANH_SACH_DA)];
      if (ds.length >= 3 && !laPa(tho) && /^(đáp\s*án|đ\/?a\b|\d)/i.test(s) && s.replace(RE_DANH_SACH_DA, '').replace(/đáp\s*án|[:,;.\s|–-]/gi, '').length < 4) {
        dsDapAn = dsDapAn || {}; ds.forEach(x => { dsDapAn[+x[1]] = x[2].toUpperCase(); }); continue;
      }
      // dòng đáp án
      if (RE_DA.test(tho)) {
        const v = sach(tho.replace(RE_DA, ''));
        if (/^(\d{1,3}\s*[-–.:)\/]?\s*[A-Fa-f]\b[\s,;.]*)+$/.test(v)) {      // «Đáp án: 1C 2A» (dù chỉ một cặp)
          dsDapAn = dsDapAn || {}; [...v.matchAll(RE_DANH_SACH_DA)].forEach(x => { dsDapAn[+x[1]] = x[2].toUpperCase(); }); continue;
        }
        if (!cur) continue;
        const m = /^\(?([A-Fa-f])\)?\s*[.):]?\s*(.*)$/.exec(v);
        if (m && cur.pa.length && (m[2] === '' || cur.pa.some(p => sach(p.tho).toLowerCase() === m[2].toLowerCase()) || m[2].length < 2)) cur.dapChu = m[1].toUpperCase();
        else if (cur.pa.length) { const i = cur.pa.findIndex(p => sach(p.tho).toLowerCase() === v.toLowerCase()); if (i >= 0) cur.dapChu = String.fromCharCode(65 + i); else cur.dapAn = v; }
        else cur.dapAn = v;
        continue;
      }
      // bắt đầu câu mới «Câu 3:» hoặc «3.»
      let m = RE_CAU.exec(tho);
      if (m || (!coCauSo && RE_SO.test(tho) && !(cur && cur.pa.length === 0 && !cur.hoiTho))) {
        const so = m ? +m[1] : +RE_SO.exec(tho)[1];
        const conLai = m ? tho.slice(m[0].length) : tho.replace(RE_SO, '');
        moi(so);
        const tach = tachPaTrenDong(conLai);
        if (tach) { cur.hoiTho = tach.truoc; tach.pa.forEach(themPa); }
        else cur.hoiTho = conLai;
        continue;
      }
      // phương án
      const tach = tachPaTrenDong(tho);
      if (tach && (cur || tach.truoc)) {
        if (tach.truoc) { if (!cur || cur.pa.length || cur.dapAn || cur.dapChu) moi(); cur.hoiTho += (cur.hoiTho ? ' ' : '') + tach.truoc; }
        tach.pa.forEach(themPa); continue;
      }
      if (laPa(tho) && cur && !(cur.pa.length === 0 && /[?:]\s*$/.test(s) === false && s.length > 120)) {
        const chu = RE_PA.exec(tho)[2].toUpperCase();
        if (chu.charCodeAt(0) - 65 === cur.pa.length) { themPa(tho); continue; }
      }
      // «câu hỏi => đáp án» trên cùng một dòng
      const ph = choMuiTen ? /^(.*?\S)\s*(?:=>|->|→|\s\|\s|\t)\s*(\S.*)$/.exec(s) : null;
      if (ph && !/^\s*[A-F][.)]/.test(s)) {
        moi(); cur.hoiTho = ph[1]; cur.dapAn = ph[2]; continue;
      }
      // dòng thường: nối vào câu hỏi đang viết hoặc mở câu mới
      if (!cur || cur.pa.length || cur.dapAn || cur.dapChu) moi();
      cur.hoiTho += (cur.hoiTho ? '\n' : '') + tho;
    }
    const kq = [];
    cau.forEach((c, i) => {
      const hoi = sach(c.hoiTho.replace(/\n/g, ' ')).replace(/^[:.\-–)\s]+/, '');
      if (!hoi && !c.pa.length) return;
      const o = { hoi, loai: c.pa.length >= 2 ? 'tn' : 'ngan', pa: [], dung: null, dapAn: '' };
      if (o.loai === 'tn') {
        o.pa = c.pa.map(p => sach(p.tho).replace(/^[.):\s]+/, '').replace(/^(\d+)\.$/, '$1')).slice(0, 6);
        let dung = null;
        if (c.dapChu) dung = c.dapChu.charCodeAt(0) - 65;
        else if (dsDapAn && c.so != null && dsDapAn[c.so]) dung = dsDapAn[c.so].charCodeAt(0) - 65;
        else if (dsDapAn && dsDapAn[kq.length + 1]) dung = dsDapAn[kq.length + 1].charCodeAt(0) - 65;
        else {
          const sao = c.pa.map((p, j) => p.dung ? j : -1).filter(j => j >= 0);
          if (sao.length === 1) dung = sao[0];
          else {
            // ưu tiên phần NỘI DUNG phương án được nhấn; chỉ khi không rõ mới xét nhãn «A.» được nhấn
            const nd = c.pa.map((p, j) => p.nhan >= .6 ? j : -1).filter(j => j >= 0);
            const nn = c.pa.map((p, j) => p.nhanChu ? j : -1).filter(j => j >= 0);
            if (nd.length === 1 && nd.length < c.pa.length) dung = nd[0];
            else if (!nd.length && nn.length === 1 && nn.length < c.pa.length) dung = nn[0];
          }
        }
        o.dung = dung != null && dung >= 0 && dung < o.pa.length ? dung : null;
        if (o.dung == null) canhBao.push(`Câu ${kq.length + 1}: chưa nhận ra đáp án đúng – bấm vào chữ cái của phương án đúng để chọn.`);
        if (c.dapAn && o.dung == null) o.dapAn = c.dapAn;
      } else {
        if (c.pa.length === 1) o.hoi += ' ' + sach(c.pa[0].tho);
        o.dapAn = c.dapAn || '';
        if (!o.dapAn) canhBao.push(`Câu ${kq.length + 1}: chưa có đáp án – có thể gõ thêm sau (không bắt buộc).`);
      }
      kq.push(o);
    });
    return { cau: kq, canhBao };
  }

  function phanTichBang(dongs) {
    const hang = dongs.map(d => d.split('\t')).filter(r => r.some(x => boNhan(x).trim()));
    const canhBao = [], kq = [];
    if (!hang.length) return { cau: [], canhBao };
    let iHoi = -1, iPa = [], iDa = -1, bd = 0;
    for (let i = 0; i < Math.min(6, hang.length); i++) {
      const r = hang[i].map(x => sach(x).toLowerCase());
      const h = r.findIndex(x => /^(câu\s*hỏi|nội\s*dung(\s*câu\s*hỏi)?|câu|đề\s*bài|question)$/.test(x));
      if (h >= 0) {
        iHoi = h;
        r.forEach((x, j) => { if (/^(phương\s*án\s*)?[a-f]$|^(pa|lựa\s*chọn)\s*[a-f1-6]$|^option\s*[a-f1-6]$/.test(x)) iPa.push(j); });
        iDa = r.findIndex(x => /^(đáp\s*án(\s*đúng)?|đ\/a|kết\s*quả|answer|key|trả\s*lời)$/.test(x));
        bd = i + 1; break;
      }
    }
    if (iHoi < 0) {
      // không có tiêu đề: bỏ cột số thứ tự, cột cuối là đáp án nếu là một chữ cái hoặc khi chỉ có 2 cột
      const soCot = Math.max(...hang.map(r => r.length));
      const laSo = j => hang.filter(r => /^\s*\d{1,3}\s*[.)]?\s*$/.test(boNhan(r[j] || ''))).length >= hang.length * .6;
      let j0 = laSo(0) ? 1 : 0;
      iHoi = j0;
      const cuoi = soCot - 1;
      const chuCai = hang.filter(r => /^\s*[A-Fa-f]\s*$/.test(boNhan(r[cuoi] || ''))).length >= hang.length * .5;
      if (cuoi - iHoi >= 2) { for (let j = iHoi + 1; j < (chuCai ? cuoi : soCot); j++) iPa.push(j); iDa = chuCai ? cuoi : -1; }
      else iDa = cuoi > iHoi ? cuoi : -1;
    }
    hang.slice(bd).forEach(r => {
      const hoi = sach(r[iHoi] || '').replace(/^(câu\s*\d+\s*[:.)]?\s*)/i, '');
      if (!hoi) return;
      const pa = iPa.map(j => sach(r[j] || '').replace(/^[A-Fa-f]\s*[.)]\s*/, '')).filter(Boolean);
      const da = iDa >= 0 ? sach(r[iDa] || '') : '';
      const o = { hoi, loai: pa.length >= 2 ? 'tn' : 'ngan', pa: pa.length >= 2 ? pa : [], dung: null, dapAn: '' };
      if (o.loai === 'tn') {
        const m = /^\(?([A-Fa-f])\)?[.)]?$/.exec(da);
        if (m) o.dung = m[1].toUpperCase().charCodeAt(0) - 65;
        else if (da) { const i = pa.findIndex(p => p.toLowerCase() === da.toLowerCase()); if (i >= 0) o.dung = i; }
        else {
          const nh = iPa.map((j, k) => tiLeNhan(r[j] || '') >= .6 ? k : -1).filter(k => k >= 0);
          if (nh.length === 1) o.dung = nh[0];
        }
        if (o.dung == null || o.dung >= pa.length) { o.dung = null; canhBao.push(`Câu ${kq.length + 1}: chưa nhận ra đáp án đúng – bấm vào chữ cái của phương án đúng để chọn.`); }
      } else {
        o.dapAn = da;
        if (!da) canhBao.push(`Câu ${kq.length + 1}: chưa có đáp án – có thể gõ thêm sau (không bắt buộc).`);
      }
      kq.push(o);
    });
    return { cau: kq, canhBao };
  }

  // ───────────────────────── danh sách lớp (giống trò Gọi tên lên bảng) ─────────────────────────
  const DAU_TEN = /^(họ\s*(và|&)?\s*tên(\s*(học\s*sinh|hs))?|tên\s*(học\s*sinh|hs)|học\s*sinh|họ\s*tên)$/i;
  const DAU_HO = /^(họ\s*(và|&)?\s*(đệm|lót)|họ\s*đệm|họ\s*lót|họ)$/i;
  const DAU_RIENG = /^tên$/i;
  const KHONG = new Set(['nam', 'nữ', 'nu', 'kinh', 'tày', 'thái', 'mường', 'khmer', 'khơ me', 'hoa', 'nùng', 'mông', "h'mông", 'dao', 'gia rai', 'ê đê', 'ba na',
    'chăm', 'sán dìu', 'stt', 'tt', 'lớp', 'ghi chú', 'có', 'không', 'x', 'đạt', 'chưa đạt', 'giỏi', 'khá', 'trung bình', 'yếu', 'tốt', 'kém', 'nghỉ', 'vắng',
    'có phép', 'không phép', 'đoàn viên', 'đội viên']);
  const DONG_BO = /^(danh\s*sách|ds\b|lớp\b|trường\b|năm\s*học|sở\s|phòng\s|bộ\s|giáo\s*viên|gvcn|gv\b|ngày\b|tổng|cộng\b|ký\s*tên|người\s*lập|họ\s*và\s*tên|họ\s*tên|stt\b|học\s*kì|học\s*kỳ|môn\b|ghi\s*chú|chữ\s*ký)/i;
  function chuanTen(s) {
    s = boNhan(s).normalize('NFC').replace(/[​-‍﻿]/g, '').replace(/ /g, ' ');
    s = s.replace(/^\s*[\(\[]?\d{1,3}\s*[\.\)\]\-–:,\/]?\s+(?=\S)/, '').replace(/^\s*[-–•*·+]\s*/, '').replace(/\s+/g, ' ').trim();
    s = s.replace(/^["'“”]+|["'“”]+$/g, '').trim();
    if (s.length > 3 && s === s.toLocaleUpperCase('vi') && /\p{L}{2}/u.test(s))
      s = s.toLocaleLowerCase('vi').replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('vi'));
    return s;
  }
  function laTen(c) {
    c = (c || '').trim();
    if (!c || c.length > 45 || c.length < 2) return false;
    if (/[\d@#%=+*\/\\<>{}\[\]]/.test(c)) return false;
    if (!/\p{L}/u.test(c)) return false;
    if (KHONG.has(c.toLowerCase())) return false;
    if (DONG_BO.test(c)) return false;
    return c.split(/\s+/).length <= 7;
  }
  const soTu = c => (c || '').trim().split(/\s+/).filter(Boolean).length;
  function tachO(d) { if (d.includes('\t')) return d.split('\t'); if (d.includes(';')) return d.split(';'); if (d.includes('|')) return d.split('|'); return [d]; }
  function cotMotTu(hang, j) {
    let co = 0, tong = 0;
    hang.forEach(r => { const c = chuanTen(r[j] || ''); if (!c) return; tong++; if (laTen(c) && soTu(c) === 1) co++; });
    return tong ? co / tong : 0;
  }
  D.phanTichDs = function (van) {
    van = boNhan(van).normalize('NFC').replace(/\r/g, '');
    let dong = van.split('\n');
    const coO = dong.some(d => /[\t;|]/.test(d));
    if (!coO) dong = dong.flatMap(d => (d.includes(',') && d.split(',').filter(x => laTen(chuanTen(x))).length >= 2) ? d.split(',') : [d]);
    const hang = dong.map(d => tachO(d).map(x => x.replace(/\s+/g, ' ').trim())).filter(r => r.some(Boolean));
    const lay = (rows, f) => {
      const out = [], dem = {};
      rows.forEach(r => {
        const t = chuanTen(f(r) || '');
        if (!laTen(t)) return;
        dem[t] = (dem[t] || 0) + 1;
        out.push(dem[t] > 1 ? `${t} (${dem[t]})` : t);
      });
      return out;
    };
    for (let i = 0; i < Math.min(15, hang.length); i++) {
      const r = hang[i].map(x => x.toLowerCase().replace(/\s+/g, ' ').trim());
      const iTen = r.findIndex(x => DAU_TEN.test(x)), iHo = r.findIndex(x => DAU_HO.test(x)), iR = r.findIndex(x => DAU_RIENG.test(x));
      const sau = hang.slice(i + 1);
      if (iHo >= 0 && iR >= 0) return lay(sau, x => [x[iHo], x[iR]].filter(Boolean).join(' '));
      if (iTen >= 0) {
        const ghep = !r[iTen + 1] && cotMotTu(sau, iTen + 1) >= .8;
        return lay(sau, x => ghep ? `${x[iTen] || ''} ${x[iTen + 1] || ''}` : x[iTen]);
      }
    }
    const soCot = Math.max(1, ...hang.map(r => r.length));
    if (soCot === 1) return lay(hang, r => r[0]);
    let tot = 0, diem = -1;
    for (let j = 0; j < soCot; j++) {
      let d = 0; hang.forEach(r => { const c = chuanTen(r[j] || ''); if (laTen(c)) d += soTu(c) >= 2 ? 1 : .35; });
      if (d > diem) { diem = d; tot = j; }
    }
    let tu = 0, n = 0; hang.forEach(r => { const c = chuanTen(r[tot] || ''); if (laTen(c)) { tu += soTu(c); n++; } });
    const ghep = n && tu / n <= 2.7 && cotMotTu(hang, tot + 1) >= .8;
    return lay(hang, r => ghep ? `${r[tot] || ''} ${r[tot + 1] || ''}` : r[tot]);
  };
})();
</script>
<script>/* Mảnh ghép bí mật — tiện ích chung, hoạt cảnh và toàn bộ phần vẽ trên canvas. */
(() => {
  'use strict';
  const MG = window.MG = window.MG || {};

  // ───────────────────────── tiện ích ─────────────────────────
  const E = MG.E = {
    tuyen: p => p, vao: p => p * p * p, ra: p => 1 - (1 - p) ** 3, ra5: p => 1 - (1 - p) ** 5,
    vaoRa: p => p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2,
    nay: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
    sin: p => .5 - Math.cos(Math.PI * p) / 2,
  };
  const kep = MG.kep = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = MG.lerp = (a, b, p) => a + (b - a) * p;
  MG.hash = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  MG.rngHat = seed => { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  MG.ngauNhien = () => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; } catch (e) { return Math.random(); } };
  MG.xao = (ds, r = MG.ngauNhien) => { const a = [...ds]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const HOAT = [];
  MG.hoat = (ms, cb, ease = E.tuyen) => new Promise(res => HOAT.push({ t0: performance.now(), ms: Math.max(1, ms), cb, ease, res }));
  MG.cho = ms => MG.hoat(ms, null);
  MG.chayHoat = now => {
    const ds = HOAT.splice(0);
    for (const a of ds) {
      const p = Math.min(1, (now - a.t0) / a.ms);
      if (a.cb) try { a.cb(a.ease(p), p); } catch (e) { console.error(e); }
      if (p >= 1) a.res(); else HOAT.push(a);
    }
  };
  MG.am = (ten, o) => window.AmThanh ? AmThanh.phat(ten, o) : { dung() {} };
  MG.boTron = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const PHONG = '"BVP","Segoe UI",sans-serif';

  const V = MG.ve = {};
  V.LUOI = { 4: [2, 2], 6: [3, 2], 8: [4, 2], 9: [3, 3], 10: [5, 2], 12: [4, 3], 15: [5, 3], 16: [4, 4], 20: [5, 4] };
  V.SO_O = [4, 6, 8, 9, 12, 15, 16, 20];
  V.MAU_DOI = ['#E8384F', '#1C7ED6', '#2F9E44', '#F08C00', '#9C36B5', '#0C8599'];
  V.TEN_KIEU = { ghep: 'Mảnh ghép', the: 'Thẻ bài', cua: 'Cửa son' };
  const BANG_GHEP = [['#8467FF', '#3F22B0'], ['#4F7BFF', '#1E3FA6'], ['#B24FD9', '#5E1D8C'], ['#2BB3B1', '#0D6470'], ['#D0559B', '#7A1F5C'], ['#6A5AE8', '#2F2696']];

  // ───────────────────────── hình học các ô ─────────────────────────
  /** Dựng hình các ô trên bàn. rect: {x,y,w,h} toạ độ CSS px. */
  V.taoHinh = (soO, kieu, seed, rect) => {
    const [cot, hang] = V.LUOI[soO] || [3, 3];
    const cw = rect.w / cot, ch = rect.h / hang;
    const rnd = MG.rngHat(seed >>> 0 || 1);
    const t = .085, j = .04, u = () => (rnd() * 2 - 1) * j;
    const canh = (x0, y0, dai, rong, doc) => {      // cạnh lồi/lõm: từ (x0,y0) dài «dai» theo trục chính, lồi theo trục phụ
      const lat = rnd() < .5 ? -1 : 1, b = u(), c = u(), d = u();
      const L = v => doc ? y0 + dai * v : x0 + dai * v;
      const Wv = v => (doc ? x0 : y0) + rong * v * lat;
      const P = (l, w) => doc ? [Wv(w), L(l)] : [L(l), Wv(w)];
      return [P(0, 0), P(.2, 0), P(.5 + b + d, -t + c), P(.5 - t + b, t + c), P(.5 - 2 * t + b - d, 3 * t + c), P(.5 + 2 * t + b - d, 3 * t + c), P(.5 + t + b, t + c), P(.5 + b + d, -t + c), P(.8, 0), P(1, 0)];
    };
    const ngang = [], dung = [];
    for (let r = 0; r < hang - 1; r++) { ngang[r] = []; for (let c = 0; c < cot; c++) ngang[r][c] = canh(rect.x + c * cw, rect.y + (r + 1) * ch, cw, ch, false); }
    for (let r = 0; r < hang; r++) { dung[r] = []; for (let c = 0; c < cot - 1; c++) dung[r][c] = canh(rect.x + (c + 1) * cw, rect.y + r * ch, ch, cw, true); }
    const xuoi = (p, e) => { p.lineTo(e[0][0], e[0][1]); for (let k = 1; k < 10; k += 3) p.bezierCurveTo(e[k][0], e[k][1], e[k + 1][0], e[k + 1][1], e[k + 2][0], e[k + 2][1]); };
    const nguoc = (p, e) => { p.lineTo(e[9][0], e[9][1]); for (let k = 8; k > 0; k -= 3) p.bezierCurveTo(e[k][0], e[k][1], e[k - 1][0], e[k - 1][1], e[k - 2][0], e[k - 2][1]); };
    const manh = [];
    for (let r = 0; r < hang; r++) for (let c = 0; c < cot; c++) {
      const x = rect.x + c * cw, y = rect.y + r * ch, x1 = x + cw, y1 = y + ch;
      const o = { i: r * cot + c, r, c, x, y, w: cw, h: ch, cx: x + cw / 2, cy: y + ch / 2 };
      const o2 = new Path2D(); o2.rect(x, y, cw, ch); o.oVuong = o2;
      if (kieu === 'ghep') {
        const p = new Path2D(); p.moveTo(x, y);
        if (r === 0) p.lineTo(x1, y); else xuoi(p, ngang[r - 1][c]);
        if (c === cot - 1) p.lineTo(x1, y1); else xuoi(p, dung[r][c]);
        if (r === hang - 1) p.lineTo(x, y1); else nguoc(p, ngang[r][c]);
        if (c === 0) p.lineTo(x, y); else nguoc(p, dung[r][c - 1]);
        p.closePath();
        o.hinh = p; o.lo = p;
        const mx = cw * .34, my = ch * .34;
        o.bb = { x: x - (c > 0 ? mx : 2), y: y - (r > 0 ? my : 2), w: cw + (c > 0 ? mx : 2) + (c < cot - 1 ? mx : 2), h: ch + (r > 0 ? my : 2) + (r < hang - 1 ? my : 2) };
      } else {
        const g = Math.min(cw, ch) * (kieu === 'the' ? .045 : .022);
        const p = new Path2D(); const rr = kieu === 'the' ? Math.min(cw, ch) * .09 : Math.min(cw, ch) * .03;
        p.roundRect ? p.roundRect(x + g, y + g, cw - 2 * g, ch - 2 * g, rr) : p.rect(x + g, y + g, cw - 2 * g, ch - 2 * g);
        o.hinh = p; o.lo = o2; o.g = g;
        o.bb = { x: x - 2, y: y - 2, w: cw + 4, h: ch + 4 };
      }
      manh.push(o);
    }
    return { cot, hang, cw, ch, manh, rect, kieu };
  };

  // ───────────────────────── vẽ từng ô ─────────────────────────
  function mauGhep(o) { return BANG_GHEP[(o.c + 2 * o.r) % 6]; }
  const SD = () => V.DPR || 1;
  function vatCanh(c, p, bb, bv, sang = .5, toi = .55) {   // nổi khối: sáng góc trên trái, tối góc dưới phải
    const vong = new Path2D(); vong.rect(bb.x - 80, bb.y - 80, bb.w + 160, bb.h + 160); vong.addPath(p);
    c.save(); c.clip(p); c.fillStyle = '#000';
    c.shadowBlur = bv * 1.3 * SD();
    c.shadowColor = `rgba(255,255,255,${sang})`; c.shadowOffsetX = bv * .75 * SD(); c.shadowOffsetY = bv * .75 * SD(); c.fill(vong, 'evenodd');
    c.shadowColor = `rgba(0,0,0,${toi})`; c.shadowOffsetX = -bv * .75 * SD(); c.shadowOffsetY = -bv * .75 * SD(); c.fill(vong, 'evenodd');
    c.restore();
  }
  function soVang(c, so, x, y, co, o = {}) {
    c.save();
    c.font = `900 ${co}px ${PHONG}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const dy = co * .04;
    c.fillStyle = 'rgba(0,0,0,.38)'; c.fillText(so, x + co * .03, y + dy + co * .07);
    c.lineJoin = 'round'; c.lineWidth = co * .085; c.strokeStyle = o.vien || 'rgba(48,14,0,.62)'; c.strokeText(so, x, y + dy);
    const g = c.createLinearGradient(0, y - co * .45, 0, y + co * .45);
    (o.mau || [['#FFF6CF', 0], ['#FFD84D', .5], ['#F5A00A', 1]]).forEach(([m, k]) => g.addColorStop(k, m));
    c.fillStyle = g; c.fillText(so, x, y + dy);
    c.restore();
  }
  function veKhoa(c, x, y, s, mau = '#E6E9F5') {      // ổ khoá
    c.save(); c.translate(x, y); c.scale(s / 100, s / 100);
    c.lineWidth = 12; c.strokeStyle = mau; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-24, -8); c.lineTo(-24, -26); c.arc(0, -26, 24, Math.PI, 0); c.lineTo(24, -8); c.stroke();
    const g = c.createLinearGradient(0, -10, 0, 46); g.addColorStop(0, '#F3F5FB'); g.addColorStop(1, '#A9B0C8');
    c.fillStyle = g; MG.boTron(c, -38, -12, 76, 58, 12); c.fill();
    c.fillStyle = '#3A3F58'; c.beginPath(); c.arc(0, 12, 8, 0, 7); c.fill(); c.fillRect(-3.5, 14, 7, 16);
    c.restore();
  }
  V.veKhoa = veKhoa;

  /** Vẽ một ô ĐÓNG (hoặc BỊ KHOÁ) tại toạ độ của nó. */
  V.veO = (c, o, kieu, so, khoa = false) => {
    const m = Math.min(o.w, o.h);
    if (kieu === 'ghep') {
      const p = o.hinh, [m1, m2] = khoa ? ['#6B7290', '#2E3249'] : mauGhep(o);
      const g = c.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h); g.addColorStop(0, m1); g.addColorStop(1, m2);
      c.fillStyle = g; c.fill(p);
      c.save(); c.clip(p);
      const rg = c.createRadialGradient(o.x + o.w * .3, o.y + o.h * .22, 0, o.x + o.w * .3, o.y + o.h * .22, Math.max(o.w, o.h) * .95);
      rg.addColorStop(0, 'rgba(255,255,255,.26)'); rg.addColorStop(.55, 'rgba(255,255,255,.04)'); rg.addColorStop(1, 'rgba(0,0,0,.12)');
      c.fillStyle = rg; c.fillRect(o.bb.x, o.bb.y, o.bb.w, o.bb.h);
      if (khoa) {   // vân chéo
        c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = m * .05;
        for (let k = -o.bb.h; k < o.bb.w; k += m * .16) { c.beginPath(); c.moveTo(o.bb.x + k, o.bb.y); c.lineTo(o.bb.x + k + o.bb.h, o.bb.y + o.bb.h); c.stroke(); }
      }
      const gl = c.createLinearGradient(0, o.y - o.h * .2, 0, o.y + o.h * .5); gl.addColorStop(0, 'rgba(255,255,255,.2)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gl; c.fillRect(o.bb.x, o.bb.y, o.bb.w, o.h * .7 + (o.y - o.bb.y));
      c.restore();
      vatCanh(c, p, o.bb, Math.max(2.5, m * .035));
      c.lineWidth = Math.max(1.2, m * .008); c.strokeStyle = 'rgba(12,6,40,.6)'; c.stroke(p);
      if (khoa) { veKhoa(c, o.cx, o.cy - m * .02, m * .42); soVang(c, so, o.cx + m * .22, o.cy + m * .2, m * .16, { mau: [['#E6E9F5', 0], ['#A9B0C8', 1]], vien: 'rgba(0,0,0,.5)' }); }
      else soVang(c, so, o.cx, o.cy, m * .4);
      return;
    }
    if (kieu === 'the') {
      const p = o.hinh, x = o.x + o.g, y = o.y + o.g, w = o.w - 2 * o.g, h = o.h - 2 * o.g;
      const g = c.createLinearGradient(x, y, x, y + h);
      if (khoa) { g.addColorStop(0, '#5E6582'); g.addColorStop(1, '#2C3046'); } else { g.addColorStop(0, '#2B3B86'); g.addColorStop(1, '#131B4B'); }
      c.save(); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = m * .06 * SD(); c.shadowOffsetY = m * .025 * SD(); c.fillStyle = g; c.fill(p); c.restore();
      c.save(); c.clip(p);
      c.strokeStyle = khoa ? 'rgba(255,255,255,.05)' : 'rgba(255,214,102,.08)'; c.lineWidth = 1.2;
      const b = m * .12;
      for (let k = -h; k < w + h; k += b) { c.beginPath(); c.moveTo(x + k, y); c.lineTo(x + k + h, y + h); c.stroke(); c.beginPath(); c.moveTo(x + k + h, y); c.lineTo(x + k, y + h); c.stroke(); }
      const rg = c.createRadialGradient(x + w / 2, y + h * .35, 0, x + w / 2, y + h * .35, Math.max(w, h) * .7);
      rg.addColorStop(0, 'rgba(255,255,255,.16)'); rg.addColorStop(1, 'rgba(0,0,0,.18)'); c.fillStyle = rg; c.fillRect(x, y, w, h);
      c.restore();
      const vang = khoa ? 'rgba(220,224,240,.55)' : '#E9B949';
      c.save(); c.strokeStyle = vang; c.lineWidth = Math.max(1.5, m * .018);
      const i1 = m * .06; MG.boTron(c, x + i1, y + i1, w - 2 * i1, h - 2 * i1, m * .06); c.stroke();
      c.lineWidth = Math.max(1, m * .007); const i2 = m * .095; MG.boTron(c, x + i2, y + i2, w - 2 * i2, h - 2 * i2, m * .04); c.stroke();
      [[x + i2, y + i2], [x + w - i2, y + i2], [x + i2, y + h - i2], [x + w - i2, y + h - i2]].forEach(([a, bq]) => {   // hoa góc
        c.fillStyle = vang; c.beginPath(); const s = m * .045; c.moveTo(a, bq - s); c.lineTo(a + s, bq); c.lineTo(a, bq + s); c.lineTo(a - s, bq); c.closePath(); c.fill();
      });
      c.restore();
      if (khoa) { veKhoa(c, o.cx, o.cy, m * .4); return; }
      c.save();                                       // huy hiệu tròn ở giữa
      const R = m * .27;
      const rg2 = c.createRadialGradient(o.cx - R * .3, o.cy - R * .4, R * .1, o.cx, o.cy, R);
      rg2.addColorStop(0, '#3A4FA8'); rg2.addColorStop(1, '#16205A');
      c.fillStyle = rg2; c.beginPath(); c.arc(o.cx, o.cy, R, 0, 7); c.fill();
      c.lineWidth = m * .025; c.strokeStyle = '#F2C14E'; c.stroke();
      c.restore();
      soVang(c, so, o.cx, o.cy, m * .3);
      return;
    }
    // cửa son: hai cánh
    V.veCanhCua(c, o, so, khoa, 1, 1);
  };

  /** Hai cánh cửa son; mo1/mo2 = độ rộng còn lại của cánh trái/phải (1 = đóng hẳn). */
  V.veCanhCua = (c, o, so, khoa, mo1 = 1, mo2 = 1, doSo = 1, coKhung = true) => {
    const g = o.g, x = o.x + g, y = o.y + g, w = o.w - 2 * g, h = o.h - 2 * g, m = Math.min(o.w, o.h);
    c.save();
    const vien = m * .045, xi = x + vien, yi = y + vien, wi = w - 2 * vien, hi = h - 2 * vien;
    if (coKhung) { c.fillStyle = '#2A1308'; c.fillRect(x, y, w, h); c.fillStyle = '#120804'; c.fillRect(xi, yi, wi, hi); }   // khung gỗ
    const canh = (trai, k) => {
      if (k <= .002) return;
      const cw = wi / 2 * k, cx = trai ? xi : xi + wi - cw;
      const sang = kep(k, .25, 1);
      const gr = c.createLinearGradient(cx, 0, cx + cw, 0);
      const a = khoa ? ['#7B8199', '#4B5068'] : ['#C42B22', '#8E1912'];
      if (trai) { gr.addColorStop(0, a[1]); gr.addColorStop(.25, a[0]); gr.addColorStop(1, a[1]); } else { gr.addColorStop(0, a[1]); gr.addColorStop(.75, a[0]); gr.addColorStop(1, a[1]); }
      c.fillStyle = gr; c.fillRect(cx, yi, cw, hi);
      if (sang < 1) { c.fillStyle = `rgba(0,0,0,${(1 - sang) * .6})`; c.fillRect(cx, yi, cw, hi); }
      // khung nổi bên trong cánh
      const pv = m * .05, kv = khoa ? 'rgba(225,228,240,.6)' : '#E4B04A';
      c.strokeStyle = kv; c.lineWidth = Math.max(1, m * .012) * kep(k * 1.3, .3, 1);
      c.strokeRect(cx + pv * k, yi + pv, Math.max(0, cw - 2 * pv * k), hi - 2 * pv);
      // đinh đồng 2 cột × 3 hàng
      const R = m * .028;
      for (let i = 0; i < 2; i++) for (let j2 = 0; j2 < 3; j2++) {
        const px = cx + cw * (.3 + .4 * i), py = yi + hi * (.22 + .28 * j2);
        const rg = c.createRadialGradient(px - R * .35, py - R * .35, R * .1, px, py, R);
        rg.addColorStop(0, khoa ? '#F4F5FA' : '#FFF0B8'); rg.addColorStop(1, khoa ? '#8A90A8' : '#B07818');
        c.fillStyle = rg; c.beginPath(); c.ellipse(px, py, R * Math.max(.15, k), R, 0, 0, 7); c.fill();
      }
      // vòng nắm cửa ở mép giữa
      const hx = trai ? cx + cw - m * .055 * k : cx + m * .055 * k, hy = yi + hi * .58;
      c.lineWidth = m * .014; c.strokeStyle = khoa ? '#D9DCE8' : '#F2C14E';
      c.beginPath(); c.ellipse(hx, hy + m * .04, m * .04 * Math.max(.2, k), m * .045, 0, 0, 7); c.stroke();
      c.fillStyle = khoa ? '#D9DCE8' : '#F2C14E'; c.beginPath(); c.arc(hx, hy, m * .016, 0, 7); c.fill();
    };
    canh(true, mo1); canh(false, mo2);
    if (mo1 >= 1 && mo2 >= 1) { c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(xi + wi / 2 - 1, yi, 2, hi); }   // khe giữa
    c.restore();
    if (doSo > 0) {
      c.save(); c.globalAlpha = doSo;
      if (khoa) veKhoa(c, o.cx, o.cy - m * .1, m * .34);
      else {
        const R = m * .19, py = yi + hi * .3;              // biển số tròn bằng đồng
        const rg = c.createRadialGradient(o.cx - R * .3, py - R * .4, R * .1, o.cx, py, R);
        rg.addColorStop(0, '#FFF0B8'); rg.addColorStop(.6, '#E8B23A'); rg.addColorStop(1, '#9A6410');
        c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = m * .04 * SD(); c.shadowOffsetY = m * .015 * SD();
        c.fillStyle = rg; c.beginPath(); c.arc(o.cx, py, R, 0, 7); c.fill();
        c.shadowColor = 'transparent'; c.lineWidth = m * .012; c.strokeStyle = '#7A4A08'; c.beginPath(); c.arc(o.cx, py, R * .84, 0, 7); c.stroke();
        c.font = `900 ${m * .22}px ${PHONG}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#5A1A00'; c.fillText(so, o.cx, py + m * .012);
      }
      c.restore();
    }
  };

  /** Ảnh nhỏ (sprite) của một ô để vẽ nhanh và cho bay. */
  V.taoAnhO = (o, kieu, so, khoa, dpr) => {
    const bb = o.bb, cv = document.createElement('canvas');
    cv.width = Math.max(2, Math.ceil(bb.w * dpr)); cv.height = Math.max(2, Math.ceil(bb.h * dpr));
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, -bb.x * dpr, -bb.y * dpr);
    V.veO(c, o, kieu, so, khoa);
    return cv;
  };

  // ───────────────────────── ảnh ─────────────────────────
  const BO_ANH = new Map();
  /** Lấy đối tượng Image (đã giải mã) từ data URI; trả null nếu chưa sẵn sàng. */
  V.anh = (src, khiXong) => {
    if (!src) return null;
    let a = BO_ANH.get(src);
    if (!a) { a = new Image(); a.onload = () => { a.xong = true; khiXong && khiXong(); }; a.src = src; BO_ANH.set(src, a); if (BO_ANH.size > 24) BO_ANH.delete(BO_ANH.keys().next().value); }
    return a.xong ? a : null;
  };
  V.choAnh = src => new Promise(res => { if (!src) return res(null); const a = V.anh(src, () => res(V.anh(src))); if (a) res(a); });
  /** Vùng cắt ảnh theo khung 16:9 (cat = {x,y,z}: tâm 0..1, phóng ≥ 1). */
  V.vungCat = (img, cat, W, H) => {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const s = Math.max(W / iw, H / ih) * Math.max(1, (cat && cat.z) || 1);
    const sw = W / s, sh = H / s;
    let sx = ((cat && cat.x != null) ? cat.x : .5) * iw - sw / 2, sy = ((cat && cat.y != null) ? cat.y : .5) * ih - sh / 2;
    sx = kep(sx, 0, Math.max(0, iw - sw)); sy = kep(sy, 0, Math.max(0, ih - sh));
    return { sx, sy, sw: Math.min(sw, iw), sh: Math.min(sh, ih), iw, ih, s };
  };
  V.veAnhCat = (c, img, cat, x, y, w, h) => { const v = V.vungCat(img, cat, w, h); c.drawImage(img, v.sx, v.sy, v.sw, v.sh, x, y, w, h); };
  /** Thu nhỏ ảnh người dùng chọn -> JPEG data URI. */
  V.nenAnh = (file, toiDa = 1600, cl = .86) => new Promise((ok, loi) => {
    const url = URL.createObjectURL(file), a = new Image();
    a.onload = () => {
      const k = Math.min(1, toiDa / Math.max(a.naturalWidth, a.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(a.naturalWidth * k); cv.height = Math.round(a.naturalHeight * k);
      const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(a, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', cl));
    };
    a.onerror = () => { URL.revokeObjectURL(url); loi(new Error('Không đọc được ảnh này. Hãy chọn ảnh .jpg hoặc .png.')); };
    a.src = url;
  });
  /** «Ảnh chữ»: khi không có ảnh, dựng một tấm áp phích chứa chính từ khoá. */
  V.anhChu = (tuKhoa, kieu = 0) => {
    const W = 1600, H = 900, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    const nen = [['#FFD43B', '#F76707'], ['#38D9A9', '#1971C2'], ['#F783AC', '#7048E8'], ['#FFA94D', '#E03131']][kieu % 4];
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, nen[0]); g.addColorStop(1, nen[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalAlpha = .12; c.fillStyle = '#fff';
    for (let i = 0; i < 26; i++) { const r = MG.rngHat(i * 97 + 3); c.beginPath(); c.arc(r() * W, r() * H, 30 + r() * 140, 0, 7); c.fill(); }
    c.globalAlpha = 1;

        case 'dung': traLoiDung(); break;

    }
    if ($$('.phu.mo').length) return;

      if (cs.pha === 'hoi') {
        if (/^[a-f]$/.test(kl) && cs.cau.loai === 'tn') { const kk = kl.charCodeAt(0) - 97; if (String(cs.cau.pa[kk] || '').trim()) chonPa(kk); return; }
        if (k === 'Enter') { e.preventDefault(); traLoiDung(); return; }

        const viTri = n => { if (!dongBo) return n; let k = 0, i = 0; for (; i < goc.length && k < n; i++) if (goc[i] !== '\u0001' && goc[i] !== '\u0002') k++; return i; };

      case 'sMoTep': $('#sTepCau').click(); break;
      case 'sThem': bo.cau.push(MG.cauMoi()); sua(true); setTimeout(() => { const t = $$('#sDsCau textarea.hoi'); t.length && t[t.length - 1].focus(); const r = $('#sRuot'); r.scrollTop = r.scrollHeight; }, 30); break;
      case 'sXoaHet': if (confirm('Xoá tất cả câu hỏi của trò chơi này?')) { bo.cau = []; sua(true); } break;
      case 'sXoa': if (c && (!c.hoi.trim() || confirm('Xoá câu hỏi này?'))) { bo.cau.splice(i, 1); sua(true); } break;
      case 'sLen': if (i > 0) { [bo.cau[i - 1], bo.cau[i]] = [bo.cau[i], bo.cau[i - 1]]; sua(true); } break;
      case 'sXuong': if (i >= 0 && i < bo.cau.length - 1) { [bo.cau[i + 1], bo.cau[i]] = [bo.cau[i], bo.cau[i + 1]]; sua(true); } break;
      case 'sAnhCau': anhCauCho = i; $('#sTepAnhCau').click(); break;
      case 'sBoAnhCau': if (c) { c.anh = null; sua(true); } break;
      case 'sChonAnh': $('#sTepAnh').click(); break;
      case 'sBoAnh': bo.anh = null; sua(true); break;
      case 'dDong': $('#phuDan').classList.remove('mo'); break;
      case 'dThem': dungDan(false); break;
      case 'dThay': dungDan(true); break;
    }
  });
  MG.khiDoiCo = () => { if (MG.man() === 'soan' && tab === 'anh') { veXemAnh(); veKieuNho(); } };
})();
</script>
